<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Conectando sua loja Shopee — SmartPlace AI</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#050B14">

<style>
  :root{--bg:#0B1220;--card:#121C2E;--b:#22314B;--t:#E8EEF7;--t3:#8FA3BF;--acc:#38E1FF}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--t);
       font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .box{max-width:420px;padding:34px 30px;background:var(--card);border:1px solid var(--b);
       border-radius:16px;text-align:center}
  h1{margin:0 0 8px;font-size:1.05rem;font-weight:700}
  p{margin:0;color:var(--t3);font-size:.86rem;line-height:1.5}
  .sp{width:30px;height:30px;margin:0 auto 18px;border:3px solid var(--b);
      border-top-color:var(--acc);border-radius:50%;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  a{color:var(--acc)}
</style>
</head>
<body>
  <div class="box">
    <div class="sp" id="sp"></div>
    <h1 id="tit">Conectando sua loja Shopee…</h1>
    <p id="msg">Só um instante, estamos finalizando a autorização.</p>
  </div>
<script>
// Ponte do OAuth da Shopee.
// A Shopee exige que o redirect fique num domínio único cadastrado no app, e volta
// anexando ?code=&shop_id=. Esta página recebe isso no domínio do produto e repassa
// pra função smartplace-oauth. A loja vem do localStorage (gravado no painel na hora
// do clique em Conectar), porque não dá pra mandar querystring nossa no redirect.
(function () {
  var OAUTH = "https://ssgeggkaweixaqxxtbqm.supabase.co/functions/v1/smartplace-oauth";
  var PAINEL = "https://smartplaceai.app/";

  function falhar(motivo) {
    document.getElementById("sp").style.display = "none";
    document.getElementById("tit").textContent = "Não foi possível concluir";
    document.getElementById("msg").innerHTML =
      motivo + '<br><br><a href="' + PAINEL + '">Voltar ao painel</a>';
  }

  var q = new URLSearchParams(location.search);
  var code = q.get("code");
  var shop_id = q.get("shop_id");

  var loja = "";
  try { loja = localStorage.getItem("sp_loja") || ""; } catch (e) {}

  if (!code) return falhar("A Shopee não devolveu o código de autorização.");
  if (!loja) return falhar("Não identificamos sua loja. Volte ao painel e clique em Conectar novamente, na mesma aba.");

  location.replace(
    OAUTH + "?fluxo=callback&plataforma=shopee" +
    "&code=" + encodeURIComponent(code) +
    "&shop_id=" + encodeURIComponent(shop_id || "") +
    "&state=" + encodeURIComponent(loja)
  );
})();
</script>
</body>
</html>
