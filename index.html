<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartPlace AI</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#050B14">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--g:#050B14;--p:#0A1526;--p2:#071120;--l:#16324A;--n:#38E1FF;--nd:#38E1FF1E;--acc:#F5A623;--gold:#FFD700;
--t:#E6F1FA;--t2:#A6BDD2;--t3:#6A87A3;--sans:'Manrope',system-ui,sans-serif;--disp:'Sora',var(--sans);--mono:'JetBrains Mono',monospace}
*{margin:0;box-sizing:border-box}body{background:var(--g);color:var(--t);font-family:var(--sans);min-height:100vh}
.topo{position:sticky;top:0;z-index:10;background:#050B14EE;backdrop-filter:blur(8px);border-bottom:1px solid var(--l)}
.topo-in{max-width:1460px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:56px}
.logo{font-family:var(--disp);font-weight:700;font-size:1.1rem;white-space:nowrap}.logo em{font-style:normal;color:var(--n)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button{background:none;border:0;color:var(--t2);font-family:var(--sans);font-weight:600;font-size:.84rem;padding:17px 13px;cursor:pointer;border-bottom:2px solid transparent}
.nav button:hover{color:var(--t)}
.nav button.atv{color:var(--n);border-bottom-color:var(--n)}
.dir{margin-left:auto;display:flex;align-items:center;gap:12px}
.live{display:flex;align-items:center;gap:6px;background:var(--nd);border:1px solid #38E1FF55;color:var(--n);font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:99px;font-family:var(--mono);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--n)}
.sair{color:var(--t3);font-size:.8rem;cursor:pointer;background:none;border:0;font-family:var(--sans)}
.wrap{max-width:1460px;margin:0 auto;padding:6px 22px 48px}
h2{font-family:var(--disp);font-size:.74rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--t3);margin:24px 0 10px}
h1{font-family:var(--disp);font-size:1.25rem;margin:22px 0 2px}
.sub-h1{color:var(--t3);font-size:.83rem;margin-bottom:4px}
.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:16px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.conn{display:flex;gap:12px;align-items:center}
.mark{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-family:var(--disp);font-size:.8rem;color:#04101C;flex:none}
.state{margin-left:auto;font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;text-decoration:none}
.on{color:var(--n);background:var(--nd);border:1px solid #38E1FF44}
.off{color:#1A0F00;background:var(--acc);cursor:pointer;border:0;font-family:var(--sans)}
.feed .ev{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--l);font-size:.85rem;color:var(--t2)}
.feed .ev:last-child{border-bottom:0}
.t{font-family:var(--mono);font-size:.7rem;color:var(--t3);flex:none;width:84px}
.auto{display:flex;gap:12px;align-items:center}
.tgl{margin-left:auto;width:36px;height:20px;border-radius:99px;position:relative;flex:none;cursor:pointer;border:0}
.tgl.on2{background:var(--n)}.tgl.off2{background:var(--l)}
.tgl::after{content:'';position:absolute;top:2.5px;width:15px;height:15px;border-radius:50%;background:#04101C}
.tgl.on2::after{right:2.5px}.tgl.off2::after{left:2.5px;background:var(--t3)}
.alerta{border-left:3px solid var(--gold);padding:10px 14px;background:var(--p2);border-radius:8px;color:var(--t2);font-size:.85rem;margin:8px 0}
.centro{max-width:400px;margin:8vh auto;display:flex;flex-direction:column;gap:12px;padding:0 18px}
input{background:var(--p2);border:1px solid var(--l);border-radius:10px;padding:12px 14px;color:var(--t);font-family:var(--sans);font-size:.95rem}
input:focus{outline:2px solid #38E1FF55}
.btn{background:var(--acc);color:#1A0F00;font-weight:800;border-radius:10px;padding:12px;border:0;font-size:.95rem;cursor:pointer;font-family:var(--sans)}
.link{color:var(--t3);font-size:.82rem;text-align:center;cursor:pointer;background:none;border:0;font-family:var(--sans)}
.erro{color:#FF7B7B;font-size:.83rem;text-align:center;min-height:1.2em}
.vazio{color:var(--t3);font-size:.85rem;padding:8px 0}
.kpi .lbl{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);font-weight:700}
.kpi .val{font-family:var(--mono);font-size:1.45rem;font-weight:600;margin-top:6px}
.kpi .sub{font-size:.73rem;color:var(--t2);margin-top:2px}
.mini{background:var(--nd);border:1px solid #38E1FF44;color:var(--n);border-radius:8px;padding:4px 12px;font-size:.7rem;cursor:pointer;font-family:var(--sans);font-weight:700}
.mini:disabled{opacity:.5}
.tabela{width:100%;border-collapse:collapse;font-size:.86rem}
.tabela th{text-align:left;color:var(--t3);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;padding:12px 14px;border-bottom:1px solid var(--l);font-weight:700}
.tabela td{padding:13px 14px;border-bottom:1px solid #10233C;vertical-align:middle}
.tabela td, .tabela td *{font-family:var(--sans)}
.tabela td b{font-weight:700}
.tabela tr:hover td{background:#0C1930}
.tabela tr:last-child td{border-bottom:0}
.badge{font-size:.62rem;font-weight:800;border-radius:6px;padding:2px 7px;color:#04101C;font-family:var(--disp);white-space:nowrap}
.pill{font-size:.66rem;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill.ok{color:var(--n);background:var(--nd)}
.pill.ok2{color:#3ddc84;background:#3ddc8422}
.pill.ruim{color:#FF9B9B;background:#FF6B6B22}
.impop{display:block;width:100%;text-align:left;background:none;border:0;color:var(--t);font-family:var(--sans);font-size:.8rem;padding:8px 10px;cursor:pointer;border-radius:8px}
.impop:hover{background:var(--p2)}
#porcanal .tabela{font-size:.82rem}
#porcanal .tabela td,#porcanal .tabela th{padding:12px 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--p2);border:1px solid var(--l);color:var(--t2);border-radius:99px;padding:5px 14px;font-size:.76rem;font-weight:600;cursor:pointer;font-family:var(--sans)}
.chip.atv{background:var(--nd);border-color:#38E1FF66;color:var(--n)}
.busca{background:var(--p2);border:1px solid var(--l);border-radius:10px;padding:8px 13px;color:var(--t);font-size:.83rem;min-width:240px}
.tit{font-size:.85rem}
.lb{font-size:.7rem;color:var(--t3);display:flex;flex-direction:column;gap:4px;font-weight:600}
.w100{width:100%;min-width:0}
.edt{width:92px;background:var(--p2);border:1px solid var(--l);border-radius:8px;color:var(--t);padding:5px 8px;font-family:var(--mono);font-size:.78rem}
.edt:focus{outline:2px solid #38E1FF55}
.itg{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;border-radius:10px;padding:11px 12px;color:var(--t2);font-family:var(--sans);font-size:.85rem;font-weight:600;cursor:pointer}
.itg:hover{background:var(--p2)}
.itg.atv{background:var(--p2);color:var(--t)}
.ponto{width:8px;height:8px;border-radius:50%;flex:none}
.regra{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #10233C;font-size:.83rem;color:var(--t2)}
.regra:last-child{border-bottom:0}
@media(max-width:720px){ .itg-grid{grid-template-columns:1fr!important} .itg-form{grid-template-columns:1fr!important} }
.barra{height:6px;background:var(--l);border-radius:99px;margin-top:5px;overflow:hidden}
.barra i{display:block;height:100%;border-radius:99px}
.sku{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--l);font-size:.83rem}
.sku:last-child{border-bottom:0}
.rank{font-family:var(--mono);color:var(--t3);width:26px;flex:none;font-size:.75rem}
.etq{border:1px solid var(--l);border-radius:10px;max-width:230px;background:#fff}
@media(max-width:720px){
  .topo-in{gap:8px;padding:0 12px}
  .nav{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{padding:12px 11px;white-space:nowrap;font-size:.82rem}
  .dir{margin-left:auto}
  .live{display:none}
  .wrap{padding:6px 12px 40px}
  .busca{min-width:0;flex:1;width:100%}
  .grid,.grid4{grid-template-columns:1fr 1fr}
  .kpi .val{font-size:1.15rem}
  .tabela{font-size:.8rem}
  .tabela td,.tabela th{padding:10px 8px}
  h1{font-size:1.1rem}
  .bub{max-width:100%}
  .etq{max-width:100%}
}
@media(max-width:460px){ .grid,.grid4{grid-template-columns:1fr} }
.acao{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;font-family:var(--sans);color:var(--t);transition:border-color .15s}
.acao:hover{border-color:#38E1FF66}
.acao b{font-size:.86rem;display:block}
.acao small{color:var(--t3);font-size:.73rem}
.acao.rodando{opacity:.6;pointer-events:none}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:92%;padding:9px 13px;border-radius:12px;font-size:.84rem;line-height:1.45}
.u{align-self:flex-end;background:#16324A;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:var(--p2);border:1px solid var(--l);border-bottom-left-radius:4px;color:var(--t2)}
.ai b{color:var(--n)}
.inpt{display:flex;gap:8px;background:var(--p2);border:1px solid var(--l);border-radius:11px;padding:9px 12px;align-items:center;margin-top:4px}
</style></head><body>
<div class="topo" id="topo" style="display:none"><div class="topo-in">
  <div class="logo">Smart<em>Place</em> AI</div>
  <div class="nav" id="nav"></div>
  <div class="dir"><span class="live"><span class="dot"></span> IA operando</span><span id="lojaNome" style="color:var(--t2);font-size:.82rem"></span><button class="sair" id="sair">sair</button></div>
</div></div>
<div class="wrap" id="app"></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzZ2VnZ2thd2VpeGFxeHh0YnFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MjE2NDIsImV4cCI6MjA5OTA5NzY0Mn0.54iKvZIPENqukwtU2f0GYGSV-rwDMGDVEk3XdWmIhmE";
const sb = createClient("https://ssgeggkaweixaqxxtbqm.supabase.co", ANON);
const OAUTH = "https://ssgeggkaweixaqxxtbqm.supabase.co/functions/v1/smartplace-oauth";
const app = document.getElementById("app");
const NOMES = {mercado_livre:["Mercado Livre","#FFE600","ML","ml.png"],shopee:["Shopee","#EE4D2D","S","shopee.svg"],tiktok:["TikTok Shop","#4DE8F4","TT","tiktok.svg"]};
const ico = (c,s=18)=> NOMES[c]?`<img src="icons/${NOMES[c][3]}" alt="${NOMES[c][0]}" style="width:${Math.round(s*1.15)}px;height:${s}px;object-fit:contain;vertical-align:middle">`:"";
const AUTOS = {
nunca_sem_desconto:["Nunca sem desconto","reaplica o desconto que venceu, com o mesmo % de antes","mercado_livre"],
relampago_no_ar:["Relâmpago sempre no ar","quando a oferta relâmpago acaba, renova 3 dias com os mesmos preços","tiktok"],
avaliacoes:["Avaliações respondidas","responde 4-5★ no tom da marca; nota baixa vira alerta pra você","shopee"],
frete_gratis:["Frete grátis garantido","patrulha os anúncios e reativa o frete grátis que caiu","mercado_livre"],
sentinela_ads:["Sentinela de verba de ads","confere o saldo de ads e avisa antes de acabar","shopee"],
relatorio_email:["Relatório seg·qua·sex","resumo de tudo que a IA fez, no seu e-mail",null]};
const MENU = [["dashboard","Dashboard"],["pedidos","Pedidos"],["etiquetas","Etiquetas"],["ia","Gestão IA"],["precos","Precificação"],["ads","Ads"],["canais","Integrações"]];

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const brl = v => Number(v??0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
let VIEW = (location.hash||"#dashboard").slice(1);
let CACHE = { painel:null, dados:null, ads:null, regras:null };

// Traduz qualquer formato de falha numa frase que o cliente entenda.
// Antes isso virava "Ops: undefined" quando a resposta não trazia `error`,
// e aí ninguém — nem a IA — sabia o que tinha acontecido.
function msgErro(d, r){
  const e = d && (d.error || d.message || d.msg || d.error_description);
  if (e) return String(e);
  if (r && r.status === 401) return "Sua sessão expirou. Entre de novo, por favor.";
  if (r && r.status === 429) return "Muitas solicitações seguidas. Aguarde alguns segundos e tente de novo.";
  if (r && r.status >= 500) return "O serviço não respondeu agora. Tente de novo em instantes.";
  if (r && !r.ok) return "A solicitação não foi aceita (código " + r.status + ").";
  return "Não consegui concluir e não recebi o motivo. Tente de novo em instantes.";
}

async function acaoApi(acao, params){
  const { data:{ session } } = await sb.auth.getSession();
  const r = await fetch("https://ssgeggkaweixaqxxtbqm.supabase.co/functions/v1/smartplace-acoes",{
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+session.access_token, "apikey":ANON },
    body: JSON.stringify({ acao, params: params||{} })
  });
  let d; try { d = await r.json(); } catch(_) { d = null; }
  if (!d || typeof d !== "object") return { success:false, error: msgErro(null, r) };
  if (!d.success && !d.error) d.error = msgErro(d, r);
  return d;
}

async function render(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ document.getElementById("topo").style.display="none"; return telaLogin(); }
  const { data, error } = await sb.rpc("sp_painel");
  if(error){ app.innerHTML = "<p class='vazio'>Erro: "+esc(error.message)+"</p>"; return; }
  if(data?.sem_loja){ document.getElementById("topo").style.display="none"; return telaOnboarding(); }
  CACHE.painel = data;
  shell();
}

function telaLogin(){
  app.innerHTML = `
  <div class="centro">
    <div class="logo" style="text-align:center;font-size:1.6rem">Smart<em>Place</em> AI</div>
    <p style="color:var(--t2);text-align:center;font-size:.9rem">Sua loja de marketplaces no piloto automático</p>
    <input id="email" type="email" placeholder="seu e-mail">
    <input id="senha" type="password" placeholder="senha">
    <button class="btn" id="entrar">Entrar</button>
    <button class="link" id="criar">Não tem conta? Criar agora</button>
    <div class="erro" id="erro"></div>
  </div>`;
  const erro = m => document.getElementById("erro").textContent = m;
  document.getElementById("entrar").onclick = async()=>{
    const { error } = await sb.auth.signInWithPassword({ email: email.value, password: senha.value });
    error ? erro("Login falhou: "+error.message) : render();
  };
  document.getElementById("criar").onclick = async()=>{
    const { error } = await sb.auth.signUp({ email: email.value, password: senha.value });
    error ? erro(error.message) : erro("Conta criada! Já pode entrar.");
  };
}

function telaOnboarding(){
  app.innerHTML = `
  <div class="centro">
    <div class="logo" style="text-align:center;font-size:1.5rem">Smart<em>Place</em> AI</div>
    <p style="color:var(--t2);text-align:center">Qual o nome da sua loja?</p>
    <input id="nome" placeholder="ex.: Bella Moda Fitness">
    <button class="btn" id="ok">Criar minha loja</button>
    <div class="erro" id="erro"></div>
  </div>`;
  document.getElementById("ok").onclick = async()=>{
    const { error } = await sb.rpc("sp_criar_minha_loja",{ p_nome: nome.value || "Minha loja" });
    error ? document.getElementById("erro").textContent = error.message : render();
  };
}

// ── casca do ERP: topo fixo + menu + conteúdo por tela ──
function shell(){
  const d = CACHE.painel;
  document.getElementById("topo").style.display="";
  document.getElementById("lojaNome").textContent = d.loja.nome;
  document.getElementById("nav").innerHTML = MENU.map(([v,n])=>`<button data-v="${v}" class="${v===VIEW?"atv":""}">${n}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{ VIEW=b.dataset.v; location.hash=VIEW; shell(); });
  document.getElementById("sair").onclick = async()=>{ await sb.auth.signOut(); HIST=[]; CACHE={painel:null,dados:null,ads:null,regras:null}; render(); };
  const alertas = (d.alertas||[]).map(a=>`<div class="alerta">${a.severidade==="urgente"?"🚨":"⚠️"} ${esc(a.mensagem)}</div>`).join("");
  const views = { dashboard:viewDashboard, pedidos:viewPedidos, etiquetas:viewEtiquetas, precos:viewPrecos, ia:viewIA, ads:viewAds, canais:viewCanais };
  app.innerHTML = alertas + `<div id="conteudo"></div>`;
  (views[VIEW]||viewDashboard)(document.getElementById("conteudo"));
}

async function dados(force){
  if(!CACHE.dados || force){ const r = await acaoApi("dados_pedidos"); CACHE.dados = r.success ? r.resultado : { erro: r.error }; }
  return CACHE.dados;
}

// ── Dashboard ──
function grafBarras(dias){
  const max = Math.max(...dias.map(d=>d.total), 1);
  const W=940,H=170,bw=W/dias.length;
  return `<svg viewBox="0 0 ${W} ${H+26}" style="width:100%;display:block">
    ${dias.map((d,i)=>{ const h=Math.max(Math.round(d.total/max*H), d.total?4:2);
      return `<rect x="${(i*bw+2).toFixed(1)}" y="${H-h}" width="${(bw-4).toFixed(1)}" height="${h}" rx="3" fill="${d.total?"#38E1FF":"#16324A"}"><title>${d.dia.slice(8,10)}/${d.dia.slice(5,7)} — ${brl(d.total)}</title></rect>`;}).join("")}
    ${dias.map((d,i)=> i%5===0?`<text x="${(i*bw+2).toFixed(1)}" y="${H+18}" fill="#6A87A3" font-size="11" font-family="JetBrains Mono,monospace">${d.dia.slice(8,10)}/${d.dia.slice(5,7)}</text>`:"").join("")}
  </svg>`;
}
const hoje = off => new Date(Date.now()+off*86400000).toISOString().slice(0,10);
let FDASH = { de: hoje(-29), ate: hoje(0), canal: "todos" };
function grafCanais(porCanal){
  const ents = Object.keys(NOMES).map(k=>[k, porCanal[k]?porCanal[k].total:0]);
  const max = Math.max(...ents.map(e=>e[1]), 1);
  const W=460,H=150,bw=W/ents.length;
  return `<svg viewBox="0 0 ${W} ${H+30}" style="width:100%;display:block">
    ${ents.map(([k,v],i)=>{ const h=Math.max(Math.round(v/max*H), v?4:2); const [nome,cor]=NOMES[k];
      return `<rect x="${i*bw+bw*0.22}" y="${H-h}" width="${bw*0.56}" height="${h}" rx="4" fill="${v?"#38E1FF":"#16324A"}"><title>${nome}: ${brl(v)}</title></rect>
      <text x="${i*bw+bw/2}" y="${H+18}" fill="#6A87A3" font-size="11" text-anchor="middle">${nome}</text>`;}).join("")}
  </svg>`;
}
function viewDashboard(c){
  const d = CACHE.painel;
  c.innerHTML = `
    <h1>Dashboard</h1><div class="sub-h1">Vendas dos seus canais — dados reais</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0">
      <input type="date" class="busca" id="fDe" value="${FDASH.de}" style="min-width:0">
      <span style="color:var(--t3);font-size:.8rem">até</span>
      <input type="date" class="busca" id="fAte" value="${FDASH.ate}" style="min-width:0">
      <span class="chips" id="fCanais" style="margin:0"></span>
      <button class="mini" id="csv" style="margin-left:auto">⬇ Exportar CSV</button>
    </div>
    <div class="grid4" id="kpis"><div class="card kpi"><div class="vazio">carregando…</div></div></div>
    <div class="card" style="margin-top:12px;padding:10px 18px" id="finstrip"></div>
    <div class="grid" style="margin-top:12px">

// ── Pedidos (fila estilo Vendas Online: etapas, mês, seleção, etiquetas, faturar) ──
let FILTRO = { etapa:"todas", canal:"todos", busca:"", mes:"todos" };
let SEL = new Set();
const ETAPAS = { importado:["Importado","ok"], concluido:["Concluído","ok2"], faturado:["Faturado","ok"], cancelado:["Cancelado","ruim"] };
const etapaDe = p => p.etapa || (String(p.status).toLowerCase().includes("cancel") ? "cancelado" : "importado");
function pedidosFiltrados(r){
  return (r.ultimos||[]).filter(p=>{
    if(FILTRO.etapa!=="todas" && etapaDe(p)!==FILTRO.etapa) return false;
    if(FILTRO.canal!=="todos" && p.canal!==FILTRO.canal) return false;
    if(FILTRO.mes!=="todos" && (p.criado_canal_em||"").slice(0,7)!==FILTRO.mes) return false;
    if(FILTRO.busca){ const q=FILTRO.busca.toLowerCase();
      const alvo=(p.pedido_id+" "+(p.comprador||"")+" "+(p.itens||[]).map(i=>(i.titulo||"")+" "+(i.sku||"")).join(" ")).toLowerCase();
      if(!alvo.includes(q)) return false; }
    return true;
  });
}

         </tbody></table></div>`);

    if(acao === "promocao_geral"){
      const pct = prompt("Qual desconto aplicar nos anúncios sem promoção? (5 a 60%)","15");

      const previa = await chama({ percentual:+pct, confirmar:false });

      const q = previa.resultado.quantidade;

    } else {
      const r = await chama({});
      alert(r.success ? "Feito ✅\n\n" + JSON.stringify(r.resultado, null, 1).replace(/[{}"]/g,"") : "Ops: " + r.error);
    }
  });
  document.querySelectorAll(".tgl").forEach(b=>b.onclick = async()=>{

    const { data } = await sb.rpc("sp_painel"); CACHE.painel = data; shell();
  });
}

// ── Motor ZPL (porta fiel do visualizador do ERPCB: parser + Z64 + GFA + proxy) ──
function cleanZPLSyntax(z){return z.replace(/\^XA\s*,\s*/gi,"^XA").replace(/,\s*\^FS/gi,"^FS").replace(/\^FS\s*,/gi,"^FS").replace(/,\s*\^XZ/gi,"^XZ").trim();}
function getLabelDimensions(b,dpmm){
  const pw=b.match(/\^PW(\d+)/i), ll=b.match(/\^LL(\d+)/i);
  if(pw&&ll) return {widthIn:(+pw[1]/(dpmm*25.4)).toFixed(2), heightIn:(+ll[1]/(dpmm*25.4)).toFixed(2)};
  const gfaTotal=(b.match(/\^GFA/gi)||[]).length, fdTotal=(b.match(/\^FD/gi)||[]).length;

async function renderZpl(zpl){

  const calc = ()=>{
    const custo=V("cCusto")+V("cExtra"), fixa=V("cFixa");
    const pct=(V("cTaxa")+V("cImp")+V("cAds"))/100, marg=V("cMarg")/100;
    const el=document.getElementById("cRes");
    if(!custo) return el.innerHTML=`<b class="tit">Resultado</b><p class="vazio">Informe o custo do produto.</p>`;
    const den=1-pct-marg;
    if(den<=0.01) return el.innerHTML=`<b class="tit">Resultado</b><p class="vazio">Taxas + margem passam de 100% — impossível. Reduza a margem ou as taxas.</p>`;
    const sug=(custo+fixa)/den;
    const sug90=Math.max(Math.floor(sug)+0.90, sug);
    const linha=(p)=>{ const luc=p*(1-pct)-fixa-custo; return { p, luc, mg: p? luc/p*100 : 0 }; };
    const cen=[linha(sug90),linha(sug90*1.05),linha(sug90*1.10),linha(sug90*1.20)];
    const partes=[["Custo",custo,"#6A87A3"],["Taxas",sug90*(V("cTaxa")+V("cAds"))/100+fixa,"#F5A623"],["Imposto",sug90*V("cImp")/100,"#FF6B6B"],["Lucro",cen[0].luc,"#3ddc84"]];
    const tot=partes.reduce((s,x)=>s+Math.max(0,x[1]),0)||1;
    el.innerHTML=`<b class="tit">Resultado</b>
      <div style="margin-top:12px"><div class="lbl" style="font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)">Preço de venda sugerido</div>
      <div style="font-family:var(--mono);font-size:1.9rem;color:var(--n)">${brl(sug90)}</div>
      <small style="color:var(--t3)">lucro de <b style="color:#3ddc84">${brl(cen[0].luc)}</b> por venda · margem ${cen[0].mg.toFixed(1).replace(".",",")}%</small></div>
      <div style="display:flex;height:14px;border-radius:99px;overflow:hidden;margin:14px 0 4px">${partes.map(([n,v,cor])=>`<div title="${n}: ${brl(v)}" style="width:${Math.max(0,v)/tot*100}%;background:${cor}"></div>`).join("")}</div>
      <small style="color:var(--t3)">${partes.map(([n,v,cor])=>`<span style="color:${cor}">●</span> ${n} ${brl(v)}`).join(" · ")}</small>
      <table class="tabela" style="margin-top:14px"><tr><th>Cenário</th><th style="text-align:right">Preço</th><th style="text-align:right">Lucro</th><th style="text-align:right">Margem</th></tr>
      ${[["Sugerido",cen[0]],["+5%",cen[1]],["+10%",cen[2]],["+20%",cen[3]]].map(([n,x])=>`<tr><td>${n}</td><td style="text-align:right;font-family:var(--mono)">${brl(x.p)}</td><td style="text-align:right;font-family:var(--mono);color:${x.luc>=0?"#3ddc84":"#FF9B9B"}">${brl(x.luc)}</td><td style="text-align:right;font-family:var(--mono)">${x.mg.toFixed(1).replace(".",",")}%</td></tr>`).join("")}</table>`;
  };
  document.getElementById("cCalc").onclick = calc;
  const carregaPrec = async()=>{
    const a = await acaoApi("precificador_lista");
    const el=document.getElementById("precCard"); if(!el) return;
    if(!a.success) return el.innerHTML=`<p class="vazio">${esc(a.error||"indisponível")}</p>`;
    const prods=(a.resultado.produtos||[]);
    const pct=(V("cTaxa")+V("cImp")+V("cAds"))/100, marg=V("cMarg")/100, fixa=V("cFixa");
    el.innerHTML = prods.length? `<table class="tabela">
      <tr><th>Produto</th><th>Status</th><th style="text-align:right">Preço atual</th><th>Custo R$</th><th>Piso R$</th><th>Teto R$</th><th style="text-align:right">Margem atual</th><th style="text-align:right">Preço sugerido</th><th></th></tr>
      ${prods.map(p=>{
        const custo=p.custo!=null?Number(p.custo):null;
        const mLuc = custo!=null? p.preco*(1-pct)-fixa-custo : null;
        const mPct = mLuc!=null&&p.preco? mLuc/p.preco*100 : null;
        const den=1-pct-marg;
        const sug = custo!=null&&den>0.01? Math.floor((custo+fixa)/den)+0.90 : null;
        return `<tr>
          <td>${esc(p.titulo||"—").slice(0,48)}<br><small style="font-family:var(--mono);font-size:.68rem;color:var(--t3)">${esc(p.id)}</small></td>
          <td><span class="pill ${p.status==="active"?"ok":"ruim"}">${p.status==="active"?"ativo":esc(p.status)}</span></td>
          <td style="text-align:right;font-family:var(--mono)"><b>${brl(p.preco)}</b></td>
          <td><input class="edt" data-id="${esc(p.id)}" data-campo="custo" type="number" step="0.01" value="${custo??""}" placeholder="—"></td>
          <td><input class="edt" data-id="${esc(p.id)}" data-campo="piso" type="number" step="0.01" value="${p.piso??""}" placeholder="—"></td>
          <td><input class="edt" data-id="${esc(p.id)}" data-campo="teto" type="number" step="0.01" value="${p.teto??""}" placeholder="—"></td>
          <td style="text-align:right;font-family:var(--mono);color:${mPct==null?"var(--t3)":mPct>=0?"#3ddc84":"#FF9B9B"}">${mPct==null?"informe o custo":brl(mLuc)+"<br><small>"+mPct.toFixed(1).replace(".",",")+"%</small>"}</td>
          <td style="text-align:right;font-family:var(--mono);color:var(--n)">${sug!=null?brl(sug):"—"}</td>
          <td>${sug!=null?`<button class="mini aplicar" data-id="${esc(p.id)}" data-preco="${sug.toFixed(2)}">Aplicar</button>`:""}</td></tr>`;}).join("")}
    </table>` : "<p class='vazio'>Nenhum anúncio encontrado — conecte o Mercado Livre.</p>";
    document.querySelectorAll(".edt").forEach(i=>i.onchange=async()=>{
      const r=await acaoApi("regras_preco_definir",{ produto_id:i.dataset.id, [i.dataset.campo]: i.value===""?null:+i.value });
      if(!r.success) alert("Ops: "+r.error); else carregaPrec();
    });
    document.querySelectorAll(".aplicar").forEach(b=>b.onclick=async()=>{
      if(!confirm("Mudar o preço do "+b.dataset.id+" para "+brl(+b.dataset.preco)+" no Mercado Livre?")) return;
      b.disabled=true; b.textContent="aplicando…";
      const r=await acaoApi("atualizar_preco",{ item_id:b.dataset.id, preco:+b.dataset.preco });
      b.disabled=false; b.textContent="Aplicar";
      r.success? carregaPrec() : alert("Ops: "+r.error);
    });
  };
  carregaPrec();
  document.getElementById("pRecalc").onclick = carregaPrec;
}

// ── Fale com a IA ──
let HIST = [];
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
function bolhas(extra){
  const msgs = HIST.map(m=>`<div class="bub ${m.role==="user"?"u":"ai"}">${m.role==="user"?esc(m.content):fmt(m.content)}</div>`).join("");
  return (msgs || `<div class="bub ai">Oi! 👋 Sou a IA da sua loja. Me pede coisas como: <b>"quanto vendi esse mês?"</b>, <b>"aplica 15% no que está sem promoção"</b>, <b>"define piso de R$ 89,90 pro anúncio X"</b> ou <b>"checa a saúde da loja"</b>.</div>`) + (extra||"");
}
async function enviarChat(){
  const inp = document.getElementById("chatIn"), box = document.getElementById("chatMsgs");
  const txt = (inp.value||"").trim(); if(!txt) return;
  inp.value = ""; HIST.push({role:"user",content:txt});
  box.innerHTML = bolhas(`<div class="bub ai" style="opacity:.7">⚙️ trabalhando na sua loja…</div>`);
  box.scrollTop = box.scrollHeight;
  const { data:{ session } } = await sb.auth.getSession();
  let resp;
  try{
    const r = await fetch("https://ssgeggkaweixaqxxtbqm.supabase.co/functions/v1/smartplace-chat",{
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+session.access_token, "apikey":ANON },
      body: JSON.stringify({ mensagens: HIST })
    });
    let d; try { d = await r.json(); } catch(_) { d = null; }
    resp = (d && d.success) ? d.resposta : "Ops: " + msgErro(d, r);
  }catch(_){ resp = "Ops, falha de conexão — tenta de novo?"; }
  HIST.push({role:"assistant",content:resp});
  const box2 = document.getElementById("chatMsgs");
  if(box2){ box2.innerHTML = bolhas(); box2.scrollTop = box2.scrollHeight; }
}
// ── Ads (gestão completa: gasto, ROAS, campanhas, análise da IA) ──
function viewAds(c){
  c.innerHTML = `
    <h1>Ads</h1><div class="sub-h1">Gestão dos anúncios pagos: gasto, cliques, ROAS por campanha — e a IA dizendo o que pausar, escalar ou trocar</div>
    <div class="grid4" id="adskpi" style="margin-top:10px"><div class="card"><p class="vazio">carregando…</p></div></div>
    <div style="margin:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn" id="adsIA" style="font-size:.88rem;padding:10px 18px">🧠 Análise da IA — ROAS, o que pausar, o que escalar</button>
      <small style="color:var(--t3)">ela puxa os números reais e devolve o plano</small>
    </div>
    <div id="adsAnalise"></div>
    <h2>Campanhas — últimos 30 dias</h2>
    <div class="card" style="padding:6px 14px;overflow-x:auto" id="adsCamp"><p class="vazio">carregando…</p></div>
    <div class="card" style="margin-top:12px"><b class="tit">🤖 Sentinela de verba</b><br>
      <small style="color:var(--t2)">A automação <b>Sentinela de verba de ads</b> (aba Gestão IA) confere o saldo a cada rodada e avisa antes da verba acabar — campanha nunca para por falta de saldo.</small></div>`;
  acaoApi("ads_dados").then(a=>{
    const k=document.getElementById("adskpi"), t=document.getElementById("adsCamp");
    if(!k) return;
    if(!a.success){ k.innerHTML=`<div class="card"><p class="vazio">${esc(a.error||"indisponível")}</p></div>`; t.innerHTML="<p class='vazio'>—</p>"; return; }
    const cn=a.resultado.canais||{};
    const s=cn.shopee, m=cn.mercado_livre, tt=cn.tiktok;
    const cards=[];
    if(s){
      cards.push(`<div class="card kpi"><div class="lbl">${ico("shopee",15)} Gasto 30 dias</div><div class="val">${brl(s.d30?.gasto)}</div><div class="sub">7 dias: ${brl(s.d7?.gasto)} · saldo ${brl(s.saldo)}</div></div>`);
      cards.push(`<div class="card kpi"><div class="lbl">ROAS 30 dias</div><div class="val" style="color:${s.roas30==null?"var(--t3)":s.roas30>=3?"#3ddc84":s.roas30>=1?"var(--acc)":"#FF9B9B"}">${s.roas30!=null?String(s.roas30).replace(".",",")+"x":"—"}</div><div class="sub">cada R$ 1 em ads virou R$ ${s.roas30!=null?String(s.roas30).replace(".",","):"—"}</div></div>`);
      cards.push(`<div class="card kpi"><div class="lbl">Cliques / CTR</div><div class="val">${s.d30?.cliques??"—"}</div><div class="sub">CTR ${s.ctr30!=null?String(s.ctr30).replace(".",",")+"%":"—"} · ${s.d30?.impressoes??0} impressões</div></div>`);
      cards.push(`<div class="card kpi"><div class="lbl">GMV via ads</div><div class="val" style="color:var(--n)">${brl(s.d30?.gmv)}</div><div class="sub">${s.d30?.pedidos??0} pedido(s) em 30 dias</div></div>`);
    }
    if(m) cards.push(`<div class="card kpi"><div class="lbl">${ico("mercado_livre",15)} Mercado Ads</div><div class="val" style="color:var(--t3)">${m.advertiser_id?"ativo":"—"}</div><div class="sub">${esc(m.info||"")}</div></div>`);
    if(tt) cards.push(`<div class="card kpi"><div class="lbl">${ico("tiktok",15)} TikTok Ads</div><div class="val" style="color:var(--t3)">—</div><div class="sub">${esc(tt.info||"")}</div></div>`);
    if(!cards.length) cards.push(`<div class="card"><p class="vazio">Conecte um canal com anúncios pagos (Shopee Ads é o mais completo) pra ver gasto e ROAS aqui.</p></div>`);
    k.innerHTML = cards.join("");
    const camps = s?.campanhas||[];
    const diag = x=>{
      if(!x.cliques) return `<span class="pill ruim">💤 sem cliques</span>`;
      if(x.roas==null||!x.gasto) return `<span class="pill ok">—</span>`;
      if(x.roas<1) return `<span class="pill ruim">🔴 gastando sem retorno</span>`;
      if(x.roas<3) return `<span class="pill" style="color:var(--acc);background:#F5A62322">🟡 ROAS baixo</span>`;
      return `<span class="pill ok2">🟢 saudável</span>`;
    };
    t.innerHTML = camps.length? `<table class="tabela">
      <tr><th>Campanha / Produto</th><th style="text-align:right">Gasto</th><th style="text-align:right">Cliques</th><th style="text-align:right">CTR</th><th style="text-align:right">Pedidos</th><th style="text-align:right">GMV</th><th style="text-align:right">ROAS</th><th>Diagnóstico</th></tr>
      ${camps.map(x=>`<tr><td>${esc(String(x.nome)).slice(0,50)}</td>
        <td style="text-align:right;font-family:var(--mono)">${brl(x.gasto)}</td>
        <td style="text-align:right;font-family:var(--mono)">${x.cliques}</td>
        <td style="text-align:right;font-family:var(--mono)">${x.ctr!=null?String(x.ctr).replace(".",",")+"%":"—"}</td>
        <td style="text-align:right;font-family:var(--mono)">${x.pedidos}</td>
        <td style="text-align:right;font-family:var(--mono)">${brl(x.gmv)}</td>
        <td style="text-align:right;font-family:var(--mono)"><b>${x.roas!=null?String(x.roas).replace(".",",")+"x":"—"}</b></td>
        <td>${diag(x)}</td></tr>`).join("")}
    </table>` : `<p class="vazio">${s?"Nenhuma campanha ativa encontrada nos últimos 30 dias.":"As campanhas aparecem quando um canal com ads estiver conectado (Shopee primeiro; Mercado Ads e TikTok na sequência)."}</p>`;
  });
  document.getElementById("adsIA").onclick = async()=>{
    const b=document.getElementById("adsIA"), area=document.getElementById("adsAnalise");
    b.disabled=true; b.textContent="🧠 analisando seus ads…";
    area.innerHTML=`<div class="card" style="margin-bottom:12px"><p class="vazio">⚙️ puxando os números e pensando…</p></div>`;
    const { data:{ session } } = await sb.auth.getSession();
    try{
      const r = await fetch("https://ssgeggkaweixaqxxtbqm.supabase.co/functions/v1/smartplace-chat",{
        method:"POST", headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+session.access_token, "apikey":ANON },
        body: JSON.stringify({ mensagens:[{ role:"user", content:"Analise meus anúncios pagos agora: puxe os dados de ads, avalie gasto, CTR e ROAS geral e por campanha, e me diga objetivamente: o que pausar, o que escalar, onde trocar o criativo/anúncio e se vale testar outro produto. Se algum canal não tiver dados, diga o porquê em uma linha." }] })
      });
      const d = await r.json();
      area.innerHTML = `<div class="card" style="margin-bottom:12px"><b class="tit">🧠 Análise da IA</b><div class="bub ai" style="max-width:100%;margin-top:10px">${d.success?fmt(d.resposta):"Ops: "+esc(d.error)}</div></div>`;
    }catch(_){ area.innerHTML=`<div class="card"><p class="vazio">falha de conexão — tenta de novo</p></div>`; }
    b.disabled=false; b.textContent="🧠 Análise da IA — ROAS, o que pausar, o que escalar";
  };
}

// ── Integrações (formato ERPCB: sidebar, autenticação, sincronizar/reconectar/desconectar, regras) ──
let CANAL_SEL = "mercado_livre";
const REGRAS_CANAL = {
  mercado_livre: [
    ["Importação automática de pedidos (últimos 30 dias, seg·qua·sex + botão)", "ok"],
    ["Importar taxas do marketplace por pedido", "ok"],
    ["Importar valor do frete", "ok"],
    ["Cliente real do pedido (nome do comprador)", "ok"],
    ["Etapa pelo status real (importado → concluído / cancelado)", "ok"],
    ["Etiqueta de transporte em ZPL (impressão em lote)", "ok"],
    ["Tokens renovados automaticamente (conexão não expira)", "ok"],
    ["Faturamento NF-e direto da fila", "breve"],
  ],
  shopee: [
    ["Importação automática de pedidos", "ok"],
    ["Avaliações respondidas no tom da marca (nota baixa vira alerta)", "ok"],
    ["Sentinela de saldo de Ads", "ok"],
    ["Tokens renovados automaticamente", "ok"],
    ["Faturamento NF-e direto da fila", "breve"],
  ],
  tiktok: [
    ["Importação automática de pedidos", "ok"],
    ["Oferta relâmpago sempre no ar (renova 3 dias, mesmos preços)", "ok"],
    ["Tokens renovados automaticamente", "ok"],
    ["Faturamento NF-e direto da fila", "breve"],
  ],
};
function viewCanais(c){
  const d = CACHE.painel;
  const cx = Object.fromEntries((d.conexoes||[]).map(x=>[x.plataforma,x]));
  const desenha = ()=>{
    const conn = cx[CANAL_SEL]; const on = conn?.status === "conectada";
    const [nome] = NOMES[CANAL_SEL];
    const lado = Object.entries(NOMES).map(([k,[n]])=>{
      const okk = cx[k]?.status === "conectada";
      return `<button class="itg ${k===CANAL_SEL?"atv":""}" data-k="${k}">${ico(k,18)} <span style="flex:1;text-align:left">${n}</span><span class="ponto" style="background:${okk?"#3ddc84":"var(--t3)"}"></span></button>`;
    }).join("");
    const regras = (REGRAS_CANAL[CANAL_SEL]||[]).map(([txt,st])=>`
      <div class="regra"><span style="color:${st==="ok"?"#3ddc84":"var(--acc)"}">${st==="ok"?"✓":"⏳"}</span><span style="flex:1">${txt}</span>
      <small style="color:${st==="ok"?"#3ddc84":"var(--acc)"};font-weight:700">${st==="ok"?"Ativado":"Em breve"}</small></div>`).join("");
    c.innerHTML = `
      <h1>Integrações</h1><div class="sub-h1">Conecte suas contas — a autorização é feita no site oficial de cada plataforma</div>
      <div style="display:grid;grid-template-columns:230px 1fr;gap:14px;margin-top:12px" class="itg-grid">
        <div class="card" style="padding:8px">${lado}</div>
        <div class="card">
          <div style="display:flex;align-items:center;gap:10px">
            <b class="tit">Autenticação — ${nome}</b>
            <span class="pill ${on?"ok2":"ruim"}" style="margin-left:auto">${on?"Conectado":"Não conectado"}</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px" class="itg-form">
            <label class="lb">Login<input class="busca w100" id="itgLogin" value="${on?"carregando…":"—"}" readonly></label>
            <label class="lb">Canal de venda<input class="busca w100" value="${nome}" readonly></label>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
            ${on?`<button class="mini" id="itgSync" style="background:var(--n);border-color:var(--n);color:#04101C">🔄 Sincronizar agora</button>`:""}
            <a class="mini" id="itgConectar" style="text-decoration:none;${on?"":"background:var(--acc);border-color:var(--acc);color:#1A0F00"}" href="${OAUTH}?fluxo=authorize&plataforma=${CANAL_SEL}&loja=${d.loja.id}" onclick="try{localStorage.setItem('sp_loja','${d.loja.id}')}catch(e){}">${on?"Reconectar":"Conectar"}</a>
            ${on?`<button class="mini" id="itgDesc" style="color:#FF9B9B;border-color:#FF6B6B44">Desconectar</button>`:""}
          </div>
          ${on&&conn.conectada_em?`<small style="color:var(--t3);display:block;margin-top:8px">conectada em ${(conn.conectada_em||"").slice(0,10)}</small>`:""}
          <h2 style="margin-top:20px">Regras de operação</h2>
          <div>${regras}</div>
        </div>
      </div>`;
    document.querySelectorAll(".itg").forEach(b=>b.onclick=()=>{ CANAL_SEL=b.dataset.k; desenha(); });
    if(on){
      acaoApi("canal_info",{ plataforma: CANAL_SEL }).then(r=>{
        const el=document.getElementById("itgLogin"); if(!el) return;
        el.value = (r.success && r.resultado.login) ? r.resultado.login : (conn.conectada_em?"conta conectada":"—");
      });
      const sy=document.getElementById("itgSync");
      if(sy) sy.onclick = async()=>{ sy.disabled=true; sy.textContent="sincronizando…";
        const r=await acaoApi("sincronizar_pedidos");
        sy.disabled=false; sy.textContent="🔄 Sincronizar agora";
        alert(r.success?`Sincronizado: ${r.resultado.sincronizados} pedido(s) ✅`:"Ops: "+r.error);
        CACHE.dados=null; };
      const de=document.getElementById("itgDesc");
      if(de) de.onclick = async()=>{
        if(!confirm(`Desconectar o ${nome}? A loja para de sincronizar esse canal (dá pra reconectar quando quiser).`)) return;
        const r=await acaoApi("desconectar_canal",{ plataforma: CANAL_SEL });
        if(!r.success) return alert("Ops: "+r.error);
        const { data } = await sb.rpc("sp_painel"); CACHE.painel=data; CACHE.dados=null; shell();
      };
    }
  };
  desenha();
}

window.addEventListener("hashchange",()=>{ const v=(location.hash||"#dashboard").slice(1); if(v!==VIEW){ VIEW=v; if(CACHE.painel) shell(); } });
render();
</script></body></html>
