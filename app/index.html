      <div style="font-size:.8rem;color:var(--t2);margin:-4px 0 10px">Ligue o que a IA deve fazer sem você pedir. As que <b>agem</b> só repõem o que já existia; as outras só avisam.</div>
      <div class="card" style="padding:4px 20px" id="autoLista"><p class="vazio">carregando automações…</p></div>
      <h2>O que a IA fez</h2>
      <div class="card feed">${feed}</div>
    </div>
    </div>`;

  document.getElementById("chatSend").onclick = enviarChat;
  document.getElementById("chatIn").onkeydown = e=>{ if(e.key==="Enter") enviarChat(); };
  c.querySelectorAll(".sug").forEach(b=>b.onclick=()=>{ document.getElementById("chatIn").value = b.textContent; enviarChat(); });
  c.querySelectorAll(".feito").forEach(b=>b.onclick = async()=>{
    b.disabled = true;
    const r = await acaoApi("alerta_resolver", { id:Number(b.dataset.id) });
    if(!r.success){ b.disabled = false; return; }
    d.alertas = (d.alertas||[]).filter(a=>String(a.id)!==b.dataset.id);
    b.closest("[data-al]").remove();
    marcaAvisos();
    if(!document.querySelector("#iaPend [data-al]")) document.getElementById("iaPend").innerHTML = "<p class='vazio'>Nada esperando você agora.</p>";
  });

  const saida = document.getElementById("acxSaida");
  const mostra = (titulo, html) => { if(saida){ saida.innerHTML = `<div class="card" style="margin:12px 0 4px"><b class="tit">${titulo}</b><div style="margin-top:10px">${html}</div></div>`; saida.scrollIntoView({behavior:"smooth",block:"nearest"}); } };
  const falha = erro => mostra("Não deu certo", `<p style="font-size:.88rem;color:var(--no);margin:0">${esc(humano(erro))}</p>`);
  const dinheiro = v => v==null ? "—" : "R$ " + Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  const lin = (rot, val, ruim) => `<div class="ev"><span style="flex:1">${rot}</span><b style="color:${ruim?"var(--no)":"var(--t)"}">${val}</b></div>`;

  c.querySelectorAll(".acx").forEach(b=>b.onclick = async()=>{
    const acao = b.dataset.acao;
    if(acao==="copiar"){ PROD_ABA="anuncios"; VIEW="produtos"; location.hash=VIEW; return shell(); }
    const antes = b.textContent;
    const chama = async (params)=>{ b.disabled=true; b.textContent="…"; try{ return await acaoApi(acao, params); } finally { b.disabled=false; b.textContent=antes; } };

    if(acao==="saude_loja"){
      mostra("Saúde da loja", "<p class='vazio' style='margin:0'>Conferindo canal por canal — pode levar até 1 minuto…</p>");
      const r = await chama({}); if(!r.success) return falha(r.error);
      const x = r.resultado, partes = [];
      if(x.mercado_livre) partes.push(x.mercado_livre.erro ? lin("Mercado Livre", "não consegui ler", true)
        : lin("Mercado Livre · anúncios ativos", x.mercado_livre.ativos) + lin("sem frete grátis", x.mercado_livre.sem_frete_gratis, x.mercado_livre.sem_frete_gratis>0)
          + lin(`sem promoção (de ${x.mercado_livre.promocao_analisados} conferidos)`, x.mercado_livre.sem_promocao, x.mercado_livre.sem_promocao>0));
      if(x.shopee) partes.push(x.shopee.erro ? lin("Shopee", "não consegui ler", true)
        : lin("Shopee · avaliações sem resposta", x.shopee.avaliacoes_sem_resposta, x.shopee.avaliacoes_sem_resposta>0)
          + lin("saldo do Ads", x.shopee.saldo_ads==null ? "só no Seller Center" : dinheiro(x.shopee.saldo_ads)));
      if(x.tiktok) partes.push(x.tiktok.erro ? lin("TikTok", "não consegui ler", true)
        : lin("TikTok · relâmpago no ar", x.tiktok.relampago_ativa ? "até "+new Date(x.tiktok.coberta_ate).toLocaleDateString("pt-BR") : "não", !x.tiktok.relampago_ativa)
          + (x.tiktok.anuncios!=null ? lin("produtos sem estoque", x.tiktok.sem_estoque, x.tiktok.sem_estoque>0) : ""));
      const nota = x.mercado_livre?.nota ? `<p style="font-size:.78rem;color:var(--t3);margin:8px 0 0">${esc(x.mercado_livre.nota)}</p>` : "";
      return mostra("Saúde da loja", `<div class="feed">${partes.join("")}</div>${nota}`);
    }

    if(acao==="renovar_relampago"){
      const r = await chama({}); if(!r.success) return falha(r.error);
      const x = r.resultado;
      return mostra("Relâmpago do TikTok", `<p style="font-size:.9rem;margin:0">${x.renovada ? `Renovada por mais 3 dias com os mesmos preços (${x.produtos} produtos).` : esc(x.mensagem || "Nada a renovar agora.")}</p>`);
    }

    if(acao==="responder_avaliacoes"){
      const r = await chama({}); if(!r.success) return falha(r.error);
      const x = r.resultado;
      return mostra("Avaliações da Shopee", `<p style="font-size:.9rem;margin:0"><b>${x.respondidas||0}</b> respondida(s) pela IA.${x.aguardando_resposta_pessoal?` <b>${x.aguardando_resposta_pessoal}</b> com nota baixa e texto ficaram pra você responder.`:""}</p>`);
    }

    if(acao==="perguntas_listar"){
      const r = await chama({}); if(!r.success) return falha(r.error);
      const x = r.resultado;
      if(x.pendencias?.length) return mostra("Perguntas", `<p class='vazio'>${esc(x.pendencias[0])}</p>`);
      if(!x.total) return mostra("Perguntas", "<p class='vazio' style='margin:0'>Nenhuma pergunta esperando resposta.</p>");
      const linha = q => `<div class="ev"><span class="t">${esc(nome(q.canal))}</span><span>${esc(q.texto).slice(0,150)}</span></div>`;
      return mostra("Perguntas sem resposta",
        `<p style="font-size:.85rem;color:var(--t2);margin:0 0 6px"><b>${x.para_a_ia.length}</b> a IA pode responder · <b>${x.para_voce.length}</b> são para você (defeito, garantia, troca, atraso)</p>
         <div class="feed">${x.para_a_ia.slice(0,8).map(linha).join("")}</div>
         <p style="font-size:.8rem;color:var(--t3);margin-top:10px">Peça no chat: <i>"responda as perguntas pendentes"</i> — a IA escreve e mostra antes de publicar.</p>`);
    }

    if(acao==="promocao_geral"){
      mostra("Promoção no Mercado Livre", `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem">
          Desconto de <input id="promoPct" type="number" min="5" max="60" value="15" style="width:70px;background:var(--p2);border:1px solid var(--l);padding:6px 8px;font-family:var(--mono)"> %
          nos anúncios sem promoção <button class="mini" id="promoVer">Ver quantos</button></div><div id="promoRes" style="margin-top:10px"></div>`);
      document.getElementById("promoVer").onclick = async()=>{
        const pct = +document.getElementById("promoPct").value, res = document.getElementById("promoRes");
        res.innerHTML = "<p class='vazio' style='margin:0'>Conferindo…</p>";
        const pv = await acaoApi("promocao_geral", { percentual:pct, confirmar:false });
        if(!pv.success) return res.innerHTML = `<p style="color:var(--no);font-size:.86rem;margin:0">${esc(humano(pv.error))}</p>`;
        const q = pv.resultado.quantidade;
        if(!q) return res.innerHTML = "<p class='vazio' style='margin:0'>Todos os anúncios ativos já estão com promoção.</p>";
        res.innerHTML = `<p style="font-size:.88rem;margin:0 0 8px">${q} anúncio(s) sem promoção vão receber ${pct}% de desconto por 30 dias.</p><button class="mini" id="promoAplica" style="background:var(--acc);color:#FBFAF7;border-color:var(--acc)">Aplicar em ${q} anúncio(s)</button>`;
        document.getElementById("promoAplica").onclick = async()=>{
          res.innerHTML = "<p class='vazio' style='margin:0'>Aplicando…</p>";
          const r = await acaoApi("promocao_geral", { percentual:pct, confirmar:true });
          res.innerHTML = r.success ? `<p style="font-size:.9rem;margin:0;color:var(--n)"><b>Feito:</b> desconto aplicado em ${r.resultado.aplicados} anúncio(s).</p>` : `<p style="color:var(--no);font-size:.86rem;margin:0">${esc(humano(r.error))}</p>`;
        };
      };
      return;
    }

    if(acao==="estoque_sincronizar"){
      const p = await chama({ confirmar:false }); if(!p.success) return falha(p.error);
      const x = p.resultado;
      if(!x.divergentes) return mostra("Estoque", "<p class='vazio' style='margin:0'>Estoque igual em todos os canais.</p>");
      mostra("Estoque diferente entre canais", `<p style="font-size:.88rem;margin:0 0 6px">${x.divergentes} produto(s) com estoque diferente entre os canais.</p>
        <p style="font-size:.8rem;color:var(--t3);margin:0 0 10px">${esc(x.regra||"")}</p><button class="mini" id="estIgual" style="background:var(--acc);color:#FBFAF7;border-color:var(--acc)">Igualar agora</button>`);
      document.getElementById("estIgual").onclick = async()=>{
        const r = await chama({ confirmar:true });
        mostra("Estoque", r.success ? `<p style="font-size:.9rem;margin:0;color:var(--n)"><b>Feito:</b> ${r.resultado.ajustados} anúncio(s) ajustado(s).</p>` : `<p style="color:var(--no);font-size:.86rem;margin:0">${esc(humano(r.error))}</p>`);
      };
      return;
    }

    if(acao==="margem_real"){
      const r = await chama({ dias:30 }); if(!r.success) return falha(r.error);
      const x = r.resultado;
      const linhas = (x.itens||[]).slice(0,15).map(l=>`<tr>
        <td>${esc(String(l.titulo))}</td><td>${l.qtd}</td><td>${dinheiro(l.receita)}</td>
        <td>${dinheiro(l.taxa)}</td><td>${l.lucro==null?"<span style='color:var(--t3)'>sem custo</span>":dinheiro(l.lucro)}</td>
        <td style="color:${l.margem_pct==null?"var(--t3)":(l.margem_pct<0?"var(--no)":"var(--n)")}">${l.margem_pct==null?"—":l.margem_pct+"%"}</td></tr>`).join("");
      return mostra("Margem real — últimos 30 dias",
        `${x.no_prejuizo?`<p style="color:var(--no);font-size:.9rem"><b>${x.no_prejuizo} produto(s) no prejuízo.</b></p>`:""}
         ${x.aviso?`<p style="font-size:.83rem;color:var(--t2)">${esc(x.aviso)}</p>`:""}
         <div style="overflow-x:auto"><table class="tabela"><thead><tr><th>Produto</th><th>Qtd</th><th>Receita</th><th>Taxa</th><th>Lucro</th><th>Margem</th></tr></thead><tbody>${linhas}</tbody></table></div>`);
    }

    if(acao==="reputacao"){
      const r = await chama({}); if(!r.success) return falha(r.error);
      const x = r.resultado, ml = x.mercado_livre;
      const al = (x.alertas||[]).map(a=>`<div class="ev"><span class="t">⚠</span><span>${esc(a)}</span></div>`).join("");
      return mostra("Reputação",
        (ml?`<p style="font-size:.9rem;margin:0 0 6px">Mercado Livre — nível <b>${esc(String(ml.nivel||"—"))}</b> · cancelamentos <b>${ml.cancelamentos_pct??"—"}%</b> · reclamações <b>${ml.reclamacoes_pct??"—"}%</b> · atrasos <b>${ml.atrasos_pct??"—"}%</b></p>`:"")
        + (al?`<div class="feed">${al}</div>`:"<p class='vazio' style='margin:0'>Nenhum indicador perto do limite.</p>"));
    }

    if(acao==="canibalizacao"){
      const r = await chama({}); if(!r.success) return falha(r.error);
      const x = r.resultado;
      if(!x.encontrados) return mostra("Anúncios repetidos", "<p class='vazio' style='margin:0'>Nenhum anúncio competindo com outro.</p>");
      const g = (x.grupos||[]).slice(0,8).map(gr=>`<div class="ev"><span class="t">${gr.certeza}</span><span>
        <b>${esc(gr.motivo)}</b>${gr.sku?` · SKU ${esc(gr.sku)}`:""} — ${gr.anuncios.length} anúncios<br>
        <small style="color:var(--t3)">${gr.anuncios.slice(0,3).map(a=>esc(a.titulo).slice(0,52)).join(" · ")}</small>
        ${gr.observacao?`<br><small style="color:var(--t2)">${esc(gr.observacao)}</small>`:""}</span></div>`).join("");
      return mostra("Anúncios repetidos", `<p style="font-size:.9rem;margin:0 0 6px"><b>${x.encontrados}</b> grupo(s) encontrado(s)</p><div class="feed">${g}</div>
         <p style="font-size:.8rem;color:var(--t3);margin-top:10px">${esc(x.o_que_fazer||"")}</p>`);
    }
  });

  // A lista vem do catálogo do motor, agrupada pelo objetivo do dono.
  const desenhaAutos = async()=>{
    const el = document.getElementById("autoLista"); if(!el) return;
    const r = await acaoApi("automacoes_listar", {});
    if(!r.success){ el.innerHTML = `<p class="vazio">${esc(humano(r.error))}</p>`; return; }
    const FREQ = { "15min":"a cada 15 min", "6h":"a cada 6h", diaria:"todo dia", semanal:"toda semana" };
    const grupos = ["Preço e promoções","Atendimento","Anúncios e estoque","Relatórios"];
    const lista = r.resultado.automacoes||[];
    el.innerHTML = grupos.map(g=>{
      const itens = lista.filter(a=>(a.grupo||"Relatórios")===g);
      if(!itens.length) return "";
      return `<div style="font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding:14px 0 2px">${esc(g)}</div>` + itens.map(a=>`
      <div style="display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--fina);align-items:flex-start">
        <button class="tgl ${a.ligada?"on2":"off2"}" data-tipo="${esc(a.tipo)}" data-ligada="${a.ligada}" aria-label="${a.ligada?"Desligar":"Ligar"} ${esc(a.nome)}" style="margin:2px 0 0"></button>
        <div style="flex:1;min-width:0">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <b style="font-size:.86rem;color:${a.ligada?"var(--t)":"var(--t2)"}">${esc(a.nome)}</b>
            ${a.so_avisa?`<span class="pill" style="color:var(--t2);background:var(--p2)">Só avisa</span>`:`<span class="pill ok">Age sozinha</span>`}
          </div>
          <div style="font-size:.76rem;color:var(--t3);line-height:1.4;margin-top:2px">${esc(a.explica)}</div>
          ${a.ligada?`<div style="font-size:.72rem;color:var(--t2);margin-top:4px">${FREQ[a.frequencia]||esc(a.frequencia)}${a.ultima_execucao?` · última: ${quandoTxt(a.ultima_execucao)}${a.ultimo_resultado?" — "+esc(String(a.ultimo_resultado).slice(0,90)):""}`:" · roda na próxima rodada"}</div>`:""}
          ${a.tipo==="responder_perguntas"?`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:.78rem">
            <span style="color:var(--t2)">Antes de publicar:</span>
            <select class="modoPerg" style="background:var(--p2);border:1px solid var(--l);padding:4px 8px;font-size:.78rem;font-family:var(--sans)">
              <option value="aprovar"${(a.config?.modo||"aprovar")==="aprovar"?" selected":""}>eu aprovo cada resposta</option>
              <option value="automatico"${a.config?.modo==="automatico"?" selected":""}>a IA publica sozinha</option>
            </select>
            <button class="mini" id="testarIA">Testar a IA</button></div>`:""}
        </div>
      </div>`).join("");
    }).join("");
    const modo = el.querySelector(".modoPerg");
    if(modo) modo.onchange = async()=>{
      if(modo.value==="automatico" && !confirm("A IA vai publicar sozinha as respostas de que tiver certeza.\n\nAssunto delicado (defeito, troca, atraso) e pergunta sem informação no anúncio continuam vindo para você. Resposta no anúncio é pública e não dá pra apagar.\n\nConfirmar?")){ modo.value = "aprovar"; return; }
      const a = lista.find(x=>x.tipo==="responder_perguntas");
      const rr = await acaoApi("automacao_definir", { tipo:"responder_perguntas", ligada: !!a?.ligada, config:{ modo: modo.value } });
      if(!rr.success) return mostra("Não deu certo", `<p style="font-size:.88rem;color:var(--no);margin:0">${esc(humano(rr.error))}</p>`);
      desenhaAutos();
    };
    const bt = el.querySelector("#testarIA");
    if(bt) bt.onclick = ()=> testarIA();
    el.querySelectorAll(".tgl").forEach(b=>b.onclick = async()=>{
      const liga = b.dataset.ligada!=="true";
      b.disabled = true;
      const rr = await acaoApi("automacao_definir", { tipo:b.dataset.tipo, ligada:liga });
      if(!rr.success){ b.disabled = false; return mostra("Não deu certo", `<p style="font-size:.88rem;color:var(--no);margin:0">${esc(humano(rr.error))}</p>`); }
      const a = (CACHE.painel.automacoes||[]).find(x=>x.tipo===b.dataset.tipo);
      if(a) a.ligada = liga; else (CACHE.painel.automacoes = CACHE.painel.automacoes||[]).push({ tipo:b.dataset.tipo, ligada:liga });
      const aa = document.getElementById("autosAtivas");
      if(aa){ const n = CACHE.painel.automacoes.filter(x=>x.ligada).length; aa.textContent = n ? `${n} automaç${n>1?"ões":"ão"} ativa${n>1?"s":""}` : "nenhuma automação ligada"; }
      desenhaAutos();
    });
  };
  desenhaAutos();

  // Perguntas de comprador: o que a IA deixou pronto pra aprovar e o que é com o dono.
  const desenhaPerguntas = async()=>{
    const el = document.getElementById("iaPerg"); if(!el || !on.has("mercado_livre")) return;
    const r = await acaoApi("perguntas_fila", {});
    const ps = r.success ? (r.resultado.perguntas||[]) : [];
    if(!ps.length){ el.innerHTML = ""; return; }
    el.innerHTML = `<h2>Perguntas de clientes · ${ps.length}</h2><div class="card" style="padding:4px 18px">${ps.map(q=>`
      <div class="perg" data-id="${esc(q.pergunta_id)}" style="padding:14px 0;border-bottom:1px solid var(--fina)">
        <div style="font-size:.74rem;color:var(--t3)">${q.item_link?`<a href="${esc(q.item_link)}" target="_blank" rel="noopener" style="color:var(--t3)">${esc(String(q.item_titulo||"anúncio").slice(0,70))}</a>`:esc(q.item_titulo||"")} · ${quandoTxt(q.criada_em)}</div>
        <div style="font-size:.88rem;margin:4px 0 8px"><b>${esc(q.pergunta)}</b></div>
        ${q.status==="para_voce"?`<div style="font-size:.76rem;color:var(--no);margin-bottom:6px">${esc(q.motivo||"precisa de você")}</div>`:`<div style="font-size:.74rem;color:var(--n);margin-bottom:6px">Resposta pronta — confira e envie</div>`}
        <textarea class="pergTxt" rows="3" maxlength="2000" placeholder="Escreva a resposta" style="width:100%;box-sizing:border-box;background:var(--p2);border:1px solid var(--l);padding:8px 10px;font-family:var(--sans);font-size:.84rem;resize:vertical">${esc(q.resposta||"")}</textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
          <button class="mini pergDesc">Descartar</button>
          <button class="mini pergEnv" style="background:var(--acc);color:#FBFAF7;border-color:var(--acc)">Enviar resposta</button>
        </div>
        <p class="pergErro" style="color:var(--no);font-size:.8rem;margin:6px 0 0"></p>
      </div>`).join("")}</div>`;
    el.querySelectorAll(".perg").forEach(box=>{
      const decide = async(enviar, botao)=>{
        botao.disabled = true;
        const rr = await acaoApi("pergunta_decidir", { pergunta_id: box.dataset.id, enviar, texto: box.querySelector(".pergTxt").value });
        if(!rr.success){ botao.disabled = false; box.querySelector(".pergErro").textContent = humano(rr.error); return; }
        box.innerHTML = `<p style="font-size:.84rem;color:${enviar?"var(--n)":"var(--t3)"};margin:0">${enviar?"Resposta publicada no anúncio.":"Descartada."}</p>`;
      };
      box.querySelector(".pergEnv").onclick = e=>decide(true, e.target);
      box.querySelector(".pergDesc").onclick = e=>decide(false, e.target);
    });
  };
  desenhaPerguntas();

  // vindo dos "Primeiros passos": já dispara a ação pedida
  if(IA_AUTO){ const b = c.querySelector(`.acx[data-acao="${IA_AUTO}"]`); IA_AUTO = null; if(b) b.click(); }
}

function decodeGFA(gfaData,bpr){

        const proxyUrl=await renderViaProxySP((pre?pre+"\n":"")+lab.raw,dpmm);
        if(modo==="etiqueta_pura" || !(lab.danfeItems||[]).length){ urls.push(proxyUrl); }
        else { const comp=await composeLabelWithStrip(proxyUrl,lab.danfeItems); URL.revokeObjectURL(proxyUrl); urls.push(comp); }
      }
    }catch(e){erros.push(String(e&&e.message||e).slice(0,140));}
  }
  let html=urls.map(u=>`<img class="etq" src="${u}">`).join("");
  if(erros.length) html+=`<p class="vazio">⚠ ${erros.length} etiqueta(s) falharam: ${esc(erros[0])}</p>`;
  box.innerHTML=html||"<p class='vazio'>Nenhuma etiqueta renderizável foi encontrada no ZPL enviado.</p>";
}


// ── Pesquisa de mercado (Mercado Livre) ──
// A Shopee não libera dados de mercado pra aplicativos; o ML libera catálogo,
// mais vendidos e termos em alta — e o produto é o mesmo nos dois canais.
let PESQ = { termo:"", r:null };
function viewPesquisa(c){
  c.innerHTML = `
    <h1>Pesquisa de mercado</h1><div class="sub-h1">O que mais vende no Mercado Livre, por quanto e o que o público está buscando: pra decidir o que anunciar e por qual preço.</div>
    <div class="card" style="padding:16px 20px;margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <input id="pqTermo" class="busca" style="flex:1 1 240px" placeholder="ex.: cinta modeladora, ração para gato, fone bluetooth" value="${esc(PESQ.termo)}">
      <button class="btn" id="pqBtn" style="padding:10px 22px">Pesquisar</button>
    </div>
    <div id="pqRes"></div>`;
  const desenha = ()=>{
    const el = document.getElementById("pqRes"); if(!el) return;
    const r = PESQ.r;
    if(!r) return el.innerHTML = `<p class="vazio" style="margin-top:14px">Digite um produto ou uma categoria. Os dados vêm do Mercado Livre: a Shopee não libera pesquisa de mercado pra aplicativos.</p>`;
    if(r.erro) return el.innerHTML = `<p class="vazio" style="margin-top:14px;color:var(--no)">${esc(humano(r.erro))}</p>`;
    if(r.aviso) return el.innerHTML = `<p class="vazio" style="margin-top:14px">${esc(r.aviso)}</p>`;
    const f = r.faixa_preco;
    el.innerHTML = `
      <div style="font-size:.8rem;color:var(--t2);margin-top:16px">Categoria: <b style="color:var(--t)">${esc(r.categoria.caminho||r.categoria.nome)}</b></div>
      <div class="numeros" style="margin-top:10px">
        <div><div class="lbl">Preço dos mais vendidos</div><div class="val">${f?brl(f.mediana):"—"}</div><div class="sub">${f?`metade vende abaixo disso · de ${brl(f.menor)} a ${brl(f.maior)}`:"sem preço lido"}</div></div>
        <div><div class="lbl">Concorrência</div><div class="val">${r.produtos_no_catalogo!=null?(r.produtos_no_catalogo>=10000?"10 mil+":r.produtos_no_catalogo.toLocaleString("pt-BR")):"—"}</div><div class="sub">produtos no catálogo com esse termo</div></div>
        <div><div class="lbl">Mais vendidos lidos</div><div class="val">${r.mais_vendidos.length}</div><div class="sub">do ranking da categoria</div></div>
      </div>
      ${r.em_alta.length?`<h2>Em alta na busca${r.em_alta_de?` · ${esc(r.em_alta_de)}`:""}</h2>
      <div class="chips">${r.em_alta.map(t=>`<button class="chip pqTermo" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>`:""}
      <h2>Mais vendidos da categoria</h2>
      <div class="card" style="padding:14px 18px;overflow-x:auto">
        ${r.mais_vendidos.length?`<table class="tabela" style="min-width:620px">
          <tr><th style="width:40px">#</th><th>Produto</th><th style="text-align:right">Menor preço</th><th style="text-align:right">Vendedores</th><th></th></tr>
          ${r.mais_vendidos.map(m=>`<tr>
            <td style="color:var(--t3)">${m.posicao}º</td>
            <td style="display:flex;gap:10px;align-items:center">${m.foto?`<img src="${esc(m.foto)}" alt="" style="width:40px;height:40px;object-fit:contain;background:#fff;border:1px solid var(--l)">`:""}<span>${esc(m.nome)}</span></td>
            <td style="text-align:right;font-weight:600">${m.menor_preco!=null?brl(m.menor_preco):"—"}</td>
            <td style="text-align:right">${m.vendedores>=50?"50+":(m.vendedores||"—")}</td>
            <td style="text-align:right"><a href="${esc(m.link)}" target="_blank" rel="noopener" style="color:var(--t2);font-size:.8rem">ver no ML</a></td></tr>`).join("")}
        </table>`:`<p class="vazio">O Mercado Livre não devolveu produtos de catálogo no ranking dessa categoria.</p>`}
      </div>
      <div style="font-size:.74rem;color:var(--t3);margin-top:10px">Ranking e preços do Mercado Livre no momento da pesquisa. Anúncios fora do catálogo o ML não abre pra aplicativos.</div>`;
    document.querySelectorAll(".pqTermo").forEach(b=>b.onclick=()=>{ document.getElementById("pqTermo").value = b.dataset.t; ir(); });
  };
  const ir = async()=>{
    const termo = document.getElementById("pqTermo").value.trim();
    if(!termo) return;
    PESQ.termo = termo;
    const btn = document.getElementById("pqBtn"); btn.disabled = true;
    document.getElementById("pqRes").innerHTML = `<p class="vazio" style="margin-top:14px">pesquisando no Mercado Livre…</p>`;
    const r = await acaoApi("pesquisa_mercado", { termo });
    PESQ.r = r.success ? r.resultado : { erro: r.error };
    if(document.getElementById("pqBtn")) document.getElementById("pqBtn").disabled = false;
    desenha();
  };
  document.getElementById("pqBtn").onclick = ir;
  document.getElementById("pqTermo").onkeydown = e=>{ if(e.key==="Enter") ir(); };
  desenha();
}

// ── Precificação (calculadora + tabela precificadora) ──
const PRESET_CANAL = { ml:["Mercado Livre",14,6], shopee:["Shopee",20,4], tiktok:["TikTok Shop",13.6,2] };
function viewPrecos(c){
  c.innerHTML = `
    <h1>Precificação</h1><div class="sub-h1">O piso e o teto que você define aqui são a trava do sistema — a IA não fura, nem por ordem sua.</div>
    <div class="colunas">
      <div>
        <h2 style="margin-top:20px">Calcular preço de venda</h2>
        <div class="card" style="padding:20px">
          <div class="campos">
            <label class="lb">Custo do produto<input id="cCusto" type="number" step="0.01" class="busca w100" placeholder="R$ 0,00"></label>
            <label class="lb">Canal<select id="cCanal" class="busca w100">
              <option value="ml">Mercado Livre</option><option value="shopee">Shopee</option><option value="tiktok">TikTok Shop</option></select></label>
            <label class="lb">Margem desejada (%)<input id="cMarg" type="number" step="0.1" class="busca w100" value="20"></label>
            <label class="lb">Frete que você banca (R$)<input id="cFixa" type="number" step="0.01" class="busca w100" value="6"></label>
          </div>
          <details style="margin-top:14px">
            <summary style="cursor:pointer;font-size:.8rem;color:var(--t2)">Taxas e embalagem — já vêm dos seus pedidos</summary>
            <div class="campos" style="margin-top:12px">
              <label class="lb">Embalagem/extra (R$)<input id="cExtra" type="number" step="0.01" class="busca w100" value="0"></label>
              <label class="lb">Comissão do canal (%)<input id="cTaxa" type="number" step="0.1" class="busca w100" value="14"></label>
              <label class="lb">Imposto (%)<input id="cImp" type="number" step="0.01" class="busca w100" value="0"></label>
              <label class="lb">Ads (%)<input id="cAds" type="number" step="0.1" class="busca w100" value="0"></label>
            </div>
            <small style="color:var(--t3);font-size:.74rem;display:block;margin-top:10px">Ads (%) é quanto do preço você reinveste em anúncio. ROAS 5 → 20. ROAS 10 → 10. Sem anúncio pago → 0.</small>
          </details>
          <div id="cRes"></div>
          <button class="btn" id="cCalc" style="width:100%;margin-top:16px">Calcular preço</button>
        </div>
      </div>

      <div>
        <h2 style="margin-top:20px;display:flex;align-items:baseline;gap:12px">Regras de piso e teto
          <span id="qtdRegras" style="font-family:var(--sans);font-size:.76rem;letter-spacing:0;text-transform:none;color:var(--t2);font-weight:400"></span>
          <button class="mini" id="pRecalc" style="margin-left:auto">Recalcular</button></h2>
        <div class="card" style="padding:16px 20px;overflow-x:auto" id="precCard"><p class="vazio">carregando anúncios…</p></div>
        <div id="avisoPiso"></div>
      </div>
    </div>`;

  const V = id => Number(document.getElementById(id).value||0);
  document.getElementById("cCanal").onchange = e=>{ const [,t,f]=PRESET_CANAL[e.target.value];
    document.getElementById("cTaxa").value=t; document.getElementById("cFixa").value=f; };
  dados().then(r=>{ const f=r.financeiro||{};
    if(f.imposto_pct!=null && !V("cImp")) document.getElementById("cImp").value=f.imposto_pct;
    if(f.taxa_pct!=null) document.getElementById("cTaxa").value=f.taxa_pct;
  });

  // A conta aberta, linha por linha. O número final sozinho não convence
  // ninguém a mudar preço — o caminho até ele convence.
  const calc = ()=>{
    const el = document.getElementById("cRes");
    const custo=V("cCusto")+V("cExtra"), fixa=V("cFixa");
    const pctT=V("cTaxa"), pctI=V("cImp"), pctA=V("cAds");
    const pct=(pctT+pctI+pctA)/100, marg=V("cMarg")/100;
    if(!custo) return el.innerHTML=`<p class="vazio" style="margin-top:14px">Informe o custo do produto pra ver a conta.</p>`;
    const den=1-pct-marg;
    if(den<=0.01) return el.innerHTML=`<p class="vazio" style="margin-top:14px;color:var(--no)">Taxas mais margem passam de 100% — não existe preço que feche. Reduza a margem ou as taxas.</p>`;
    const sug=Math.max(Math.floor((custo+fixa)/den)+0.90,(custo+fixa)/den);
    const comissao=sug*pctT/100, imposto=sug*pctI/100, ads=sug*pctA/100;
    const luc=sug-custo-fixa-comissao-imposto-ads;
    const linha=(r,v,forte)=>`<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:.86rem${forte?";border-top:1px solid var(--l);margin-top:4px;padding-top:11px":""}">
      <span style="color:${forte?"var(--t)":"var(--t2)"};font-weight:${forte?600:400}">${r}</span>
      <span style="font-variant-numeric:tabular-nums;font-weight:${forte?700:400}">${v}</span></div>`;
    const cen=p=>({p, luc:p-custo-fixa-p*pct, mg:p?(p-custo-fixa-p*pct)/p*100:0});
    el.innerHTML = `
      <div style="border-top:1px solid var(--l2);margin-top:18px;padding-top:14px">
        <h2 style="margin:0 0 6px">A conta</h2>
        ${linha("Custo do produto", brl(custo))}
        ${linha("Frete que você banca", brl(fixa))}
        ${linha("Comissão do canal ("+String(pctT).replace(".",",")+"%)", brl(comissao))}
        ${pctI?linha("Imposto ("+String(pctI).replace(".",",")+"%)", brl(imposto)):""}
        ${pctA?linha("Anúncio ("+String(pctA).replace(".",",")+"%)", brl(ads)):""}
        <div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--acc);margin-top:8px;padding-top:12px">
          <span style="font-weight:600">Preço sugerido</span>
          <span style="font-size:1.6rem;font-weight:700;color:var(--n);letter-spacing:-.02em;font-variant-numeric:tabular-nums">${brl(sug)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:.84rem;color:var(--t2)">
          <span>Sobra por peça</span><span style="font-variant-numeric:tabular-nums">${brl(luc)} · ${luc/sug*100>=0?"":""}${(luc/sug*100).toFixed(1).replace(".",",")}%</span>
        </div>
        <table class="tabela" style="margin-top:16px">
          <tr><th>Se vender por</th><th style="text-align:right">Sobra</th><th style="text-align:right">Margem</th></tr>
          ${[["o sugerido",sug],["5% acima",sug*1.05],["10% acima",sug*1.10],["20% acima",sug*1.20]].map(([n,p])=>{const x=cen(p);
            return `<tr><td>${n} — ${brl(p)}</td><td style="text-align:right;color:${x.luc>=0?"var(--n)":"var(--no)"}">${brl(x.luc)}</td><td style="text-align:right">${x.mg.toFixed(1).replace(".",",")}%</td></tr>`;}).join("")}
        </table>
        <small style="color:var(--t3);font-size:.76rem;display:block;margin-top:10px">Pra aplicar num anúncio, use a coluna <b>Sugerido</b> da tabela ao lado.</small>
        ${document.getElementById("cCanal").value==="ml" ? `
        <div style="border-top:1px solid var(--l2);margin-top:18px;padding-top:14px">
          <h2 style="margin:0 0 4px">Comparar envio no Mercado Livre</h2>
          <div style="font-size:.8rem;color:var(--t2)">Frete pela tabela da sua conta, no preço sugerido.</div>
          <div class="campos" style="margin-top:10px">
            <label class="lb">Peso da embalagem (g)<input id="eP" type="number" class="busca w100" placeholder="ex.: 350"></label>
            <label class="lb">Medidas (cm)<input id="eD" class="busca w100" placeholder="ex.: 25x18x6"></label>
            <label class="lb">Seu custo de entrega no Flex (R$)<input id="eFlex" type="number" step="0.01" class="busca w100" placeholder="opcional"></label>
          </div>
          <button class="mini" id="eBtn" style="margin-top:10px">Comparar modalidades</button>
          <div id="eRes"></div>
        </div>` : ""}
      </div>`;
    const eBtn = document.getElementById("eBtn");
    if(eBtn) eBtn.onclick = async()=>{
      const out = document.getElementById("eRes");
      out.innerHTML = `<p class="vazio" style="margin-top:10px">consultando o Mercado Livre…</p>`;
      const r = await acaoApi("frete_modalidades", { preco: sug, peso_g: V("eP"), dims: document.getElementById("eD").value });
      if(!r.success) return out.innerHTML = `<p class="vazio" style="margin-top:10px;color:var(--no)">${esc(humano(r.error))}</p>`;
      const linhas = r.resultado.modalidades.map(m=>({ nome:m.nome, frete:m.frete, ok:m.disponivel }));
      if(V("eFlex")>0) linhas.push({ nome:"Flex (você entrega)", frete:V("eFlex"), ok:true });
      const sobraDe = fr => sug - custo - fr - sug*pct;
      const melhor = Math.max(...linhas.filter(l=>l.ok).map(l=>sobraDe(l.frete)));
      out.innerHTML = `<table class="tabela" style="margin-top:12px">
        <tr><th>Modalidade</th><th style="text-align:right">Frete por venda</th><th style="text-align:right">Sobra por peça</th><th style="text-align:right">Margem</th></tr>
        ${linhas.map(l=>{ if(!l.ok) return `<tr><td>${l.nome}</td><td colspan="3" style="text-align:right;color:var(--t3);font-size:.8rem">não disponível pra sua conta</td></tr>`;
          const sb = sobraDe(l.frete), top = Math.abs(sb-melhor)<0.005;
          return `<tr${top?' style="background:var(--nd)"':""}><td>${l.nome}${top?' <span class="pill ok">melhor</span>':""}</td><td style="text-align:right">${brl(l.frete)}</td><td style="text-align:right;color:${sb>=0?"var(--n)":"var(--no)"}">${brl(sb)}</td><td style="text-align:right">${(sb/sug*100).toFixed(1).replace(".",",")}%</td></tr>`; }).join("")}
      </table>
      <small style="color:var(--t3);font-size:.74rem;display:block;margin-top:8px">${r.resultado.nota?esc(r.resultado.nota)+" ":""}No Full o ML também cobra armazenagem, que não entra aqui. No Flex a entrega é sua: use o custo do seu entregador.</small>`;
    };
  };
  document.getElementById("cCalc").onclick = calc;

  const carregaPrec = async()=>{
    const a = await acaoApi("precificador_lista");
    const el=document.getElementById("precCard"); if(!el) return;
    if(!a.success) return el.innerHTML=`<p class="vazio">${esc(humano(a.error||"indisponível"))}</p>`;
    const prods=(a.resultado.produtos||[]);
    const pct=(V("cTaxa")+V("cImp")+V("cAds"))/100, marg=V("cMarg")/100, fixa=V("cFixa");
    let abaixo=[];
    // A SITUAÇÃO é a coluna que faz a tabela valer: piso e teto sozinhos são
    // dois números; o que importa é se o preço de hoje está fora deles.
    const situacao = p=>{
      if(p.piso==null && p.teto==null) return ["sem regra","",""];
      if(p.piso!=null && p.preco<Number(p.piso)) return ["abaixo do piso","ruim","1"];
      if(p.teto!=null && p.preco>Number(p.teto)) return ["acima do teto","ruim",""];
      return ["dentro","ok",""];
    };
    el.innerHTML = prods.length? `<table class="tabela">
      <tr><th>Produto</th><th style="text-align:right">Piso</th><th style="text-align:right">Preço hoje</th><th style="text-align:right">Teto</th><th style="text-align:right">Margem</th><th>Situação</th><th style="text-align:right">Sugerido</th></tr>
      ${prods.map(p=>{
        const custo=p.custo!=null?Number(p.custo):null;
        const mLuc = custo!=null? p.preco*(1-pct)-fixa-custo : null;
        const mPct = mLuc!=null&&p.preco? mLuc/p.preco*100 : null;
        const den=1-pct-marg;
        // A sugestão nunca sai da faixa que o lojista definiu: fora dela, a trava
        // recusaria o "Aplicar" e o botão pareceria quebrado.
        let sug = custo!=null&&den>0.01? Math.floor((custo+fixa)/den)+0.90 : null;
        if(sug!=null && p.piso!=null && sug<Number(p.piso)) sug=Number(p.piso);
        if(sug!=null && p.teto!=null && sug>Number(p.teto)) sug=Number(p.teto);
        const [txt,cls,alerta]=situacao(p);
        if(alerta) abaixo.push({titulo:p.titulo,piso:p.piso,preco:p.preco,id:p.id,canal:p.canal});
        const canal=p.canal||"mercado_livre";
        return `<tr${alerta?' style="background:#FDF9F8"':""}>
          <td><b>${esc(p.titulo||"—").slice(0,44)}</b><br><small style="font-size:.7rem;color:var(--t3)">${humano(esc(canal))} · ${esc(p.id)}${custo==null?" · sem custo":""}</small></td>
          <td style="text-align:right"><input class="edt" data-id="${esc(p.id)}" data-canal="${esc(canal)}" data-campo="piso" type="number" step="0.01" value="${p.piso??""}" placeholder="definir"></td>
          <td style="text-align:right;font-weight:600;${alerta?"color:var(--no)":""}">${brl(p.preco)}</td>
          <td style="text-align:right"><input class="edt" data-id="${esc(p.id)}" data-canal="${esc(canal)}" data-campo="teto" type="number" step="0.01" value="${p.teto??""}" placeholder="definir"></td>
          <td style="text-align:right;color:${mPct==null?"var(--t3)":mPct>=0?"var(--n)":"var(--no)"}">${mPct==null?'<span style="font-size:.8rem">falta o custo</span>':mPct.toFixed(1).replace(".",",")+"%"}</td>
          <td>${cls?`<span class="pill ${cls}">${txt}</span>`:`<span style="font-size:.78rem;color:var(--t3)">${txt}</span>`}</td>
          <td style="text-align:right">${sug!=null?`<b>${brl(sug)}</b><br><button class="mini aplicar" data-id="${esc(p.id)}" data-canal="${esc(canal)}" data-preco="${sug.toFixed(2)}" style="margin-top:4px">Aplicar</button>`:'<span style="font-size:.8rem;color:var(--t3)">—</span>'}</td></tr>`;}).join("")}
    </table>` : "<p class='vazio'>Nenhum anúncio encontrado — conecte o Mercado Livre ou o TikTok Shop em Integrações.</p>";

    const q=document.getElementById("qtdRegras");
    if(q){ const comRegra=prods.filter(p=>p.piso!=null||p.teto!=null).length;
      q.textContent = prods.length? `${comRegra} de ${prods.length} anúncios com regra` : ""; }

    // O aviso só aparece quando existe o problema — alerta permanente vira ruído.
    const av=document.getElementById("avisoPiso");
    if(av) av.innerHTML = abaixo.length? `<div class="alerta" style="border-left-color:var(--gold);margin-top:14px">
      <b style="color:var(--t)">${abaixo.length===1?"Um anúncio está":abaixo.length+" anúncios estão"} abaixo do próprio piso.</b>
      Isso acontece quando o preço foi mudado direto no marketplace, por fora daqui.
      ${abaixo.slice(0,3).map(x=>`<br>· ${esc(String(x.titulo||"").slice(0,40))} — hoje ${brl(x.preco)}, piso ${brl(x.piso)}
        <button class="mini subirPiso" data-id="${esc(x.id)}" data-canal="${esc(x.canal||"mercado_livre")}" data-preco="${Number(x.piso).toFixed(2)}">Subir para ${brl(x.piso)}</button>`).join("")}
      </div>` : "";

    document.querySelectorAll(".edt").forEach(i=>i.onchange=async()=>{
      const r=await acaoApi("regras_preco_definir",{ produto_id:i.dataset.id, canal:i.dataset.canal||"mercado_livre", [i.dataset.campo]: i.value===""?null:+i.value });
      if(!r.success) alert(humano(r.error)); else carregaPrec();
    });
    const aplicar = async(b)=>{
      const canal=b.dataset.canal||"mercado_livre";
      if(!confirm("Mudar o preço do "+b.dataset.id+" para "+brl(+b.dataset.preco)+" no "+humano(canal)+"?")) return;
      b.disabled=true; const t=b.textContent; b.textContent="aplicando…";
      const r=await acaoApi("atualizar_preco",{ item_id:b.dataset.id, preco:+b.dataset.preco, canal });
      b.disabled=false; b.textContent=t;
      r.success? carregaPrec() : alert(humano(r.error));
    };
    document.querySelectorAll(".aplicar,.subirPiso").forEach(b=>b.onclick=()=>aplicar(b));
  };
  carregaPrec();
  document.getElementById("pRecalc").onclick = ()=>{ carregaPrec(); calc(); };
}

function bolhas(extra){
  const msgs = HIST.map(m=>`<div class="bub ${m.role==="user"?"u":"ai"}">${m.role==="user"?esc(m.content):fmt(m.content)}</div>`).join("");

async function enviarChat(){
  const inp = document.getElementById("chatIn"), box = document.getElementById("chatMsgs");
  const txt = (inp.value||"").trim(); if(!txt) return;
  inp.value = ""; HIST.push({role:"user",content:txt});

  box.scrollTop = box.scrollHeight;
  const { data:{ session } } = await sb.auth.getSession();

      method:"POST",

    });
    c.querySelectorAll(".itgDesc").forEach(de=>de.onclick = async()=>{
      const k=de.dataset.k, [nome]=NOMES[k];
      if(!confirm(`Desconectar o ${nome}? A loja para de sincronizar esse canal (dá pra reconectar quando quiser).`)) return;
      const r=await acaoApi("desconectar_canal",{ plataforma:k });
      if(!r.success) return alert(humano(r.error));
      const { data } = await sb.rpc("sp_painel"); CACHE.painel=data; CACHE.dados=null; shell();
    });
  };
  desenha();
}

window.addEventListener("hashchange",()=>{ const v=(location.hash||"#dashboard").slice(1); if(v!==VIEW){ VIEW=v; if(CACHE.painel) shell(); } });
render();
</script></body></html>
