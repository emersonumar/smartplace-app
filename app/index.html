<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartPlace AI</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#FBFAF7">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Livro-caixa: papel quente, tinta preta, régua no lugar do cartão flutuante.
   Os nomes de token e de classe são os mesmos de antes de propósito — o JS que
   monta as telas não precisou mudar. */
:root{--g:#FBFAF7;--p:#FFFFFF;--p2:#F5F3EE;--l:#DCD7CC;--l2:#C9C3B6;--fina:#EFECE5;
--n:#1F6B4A;--nd:#EDF3EE;--no:#A33A2A;--nof:#FBEEEA;--acc:#1A1815;--gold:#C08A2A;
--t:#1A1815;--t2:#5C574E;--t3:#8A8378;
--sans:'Public Sans',system-ui,sans-serif;--disp:'Instrument Serif',Georgia,serif;--mono:var(--sans)}
*{margin:0;box-sizing:border-box}
body{background:var(--g);color:var(--t);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
.num,.kpi .val,.t,.rank,.edt,.tabela td{font-variant-numeric:tabular-nums lining-nums}

/* cabeçalho em duas fileiras: as onze seções cabem sem apertar */
.topo{position:sticky;top:0;z-index:10;background:var(--p);border-bottom:1px solid var(--l2)}
.topo-in{max-width:1460px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:14px;min-height:52px}
.nav-wrap{border-top:1px solid var(--fina)}
.nav{max-width:1460px;margin:0 auto;padding:0 22px;display:flex;gap:4px}
.logo{font-family:var(--disp);font-weight:400;font-size:1.35rem;letter-spacing:-.01em;white-space:nowrap}
.logo em{font-style:normal;color:inherit}
.nav button{background:none;border:0;color:var(--t2);font-family:var(--sans);font-weight:500;font-size:.82rem;padding:11px 10px;cursor:pointer;box-shadow:inset 0 -2px 0 transparent;white-space:nowrap}
.nav button:hover{color:var(--t)}
.nav button.atv{color:var(--t);font-weight:600;box-shadow:inset 0 -2px 0 var(--n)}
.nav .qtd{display:inline-block;min-width:17px;margin-left:5px;padding:0 5px;border-radius:99px;background:var(--gold);color:#FBFAF7;font-size:.66rem;font-weight:700;line-height:17px;text-align:center}
.nav .qtd.urg{background:var(--no)}
.dir{margin-left:auto;display:flex;align-items:center;gap:14px}
/* o selo pulsante virou uma linha discreta: a IA se prova trabalhando, não piscando */
.live{display:flex;align-items:center;gap:7px;color:var(--t2);font-size:.78rem;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--n)}
.sair{color:var(--t3);font-size:.8rem;cursor:pointer;background:none;border:0;font-family:var(--sans)}
.wrap{max-width:1460px;margin:0 auto;padding:6px 22px 48px}

h1{font-family:var(--disp);font-weight:400;font-size:1.9rem;letter-spacing:-.015em;line-height:1.15;margin:24px 0 0;padding-bottom:12px;border-bottom:2px solid var(--acc)}
h1:has(+ .sub-h1){padding-bottom:2px;border-bottom:0}
h2{font-family:var(--sans);font-size:.7rem;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--t3);margin:26px 0 10px}
.sub-h1{color:var(--t2);font-size:.85rem;margin:0;padding-bottom:12px;border-bottom:2px solid var(--acc)}
.card{background:var(--p);border:1px solid var(--l2);border-radius:0;padding:16px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border-top:1px solid var(--l2);border-bottom:1px solid var(--l2);background:var(--p)}
.grid4>.card.kpi{border:0;border-left:1px solid var(--l);border-radius:0;padding:15px 20px}
.grid4>.card.kpi:first-child{border-left:0}
.grid4>.card.kpi .val{font-size:1.6rem;font-weight:600;letter-spacing:-.025em}
.conn{display:flex;gap:12px;align-items:center}
.mark{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-family:var(--sans);font-size:.8rem;color:#FFFFFF;flex:none}
.state{margin-left:auto;font-size:.68rem;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;text-decoration:none}
.on{color:var(--n);background:var(--nd);border:1px solid #1F6B4A33}
.off{color:#FFFFFF;background:var(--acc);cursor:pointer;border:0;font-family:var(--sans)}
.feed .ev{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--fina);font-size:.85rem;color:var(--t2)}
.feed .ev:last-child{border-bottom:0}
.t{font-size:.74rem;color:var(--t3);flex:none;width:84px}
.auto{display:flex;gap:12px;align-items:center}
.tgl{margin-left:auto;width:36px;height:20px;border-radius:99px;position:relative;flex:none;cursor:pointer;border:0}
.tgl.on2{background:var(--n)}.tgl.off2{background:var(--l)}
.tgl::after{content:'';position:absolute;top:2.5px;width:15px;height:15px;border-radius:50%;background:#FFFFFF}
.tgl.on2::after{right:2.5px}.tgl.off2::after{left:2.5px;background:#FFFFFF}
.alerta{border-left:3px solid var(--gold);padding:11px 15px;background:var(--p);border:1px solid var(--l);border-left-width:3px;border-radius:0;color:var(--t2);font-size:.85rem;margin:8px 0}
.centro{max-width:400px;margin:8vh auto;display:flex;flex-direction:column;gap:12px;padding:0 18px}
input{background:var(--p);border:1px solid var(--l2);border-radius:0;padding:12px 14px;color:var(--t);font-family:var(--sans);font-size:.95rem}
input:focus{outline:2px solid #1F6B4A55}
.btn{background:var(--acc);color:#FBFAF7;font-weight:600;border-radius:0;padding:12px;border:0;font-size:.95rem;cursor:pointer;font-family:var(--sans)}
.link{color:var(--t2);font-size:.82rem;text-align:center;cursor:pointer;background:none;border:0;font-family:var(--sans)}
.erro{color:var(--no);font-size:.83rem;text-align:center;min-height:1.2em}
/* estado vazio deixa de ser um traço mudo e passa a dizer o que fazer */
.vazio{color:var(--t2);font-size:.85rem;padding:8px 0}
.kpi .lbl{font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);font-weight:600}
.kpi .val{font-family:var(--sans);font-size:1.7rem;font-weight:600;letter-spacing:-.025em;margin-top:5px}
.kpi .sub{font-size:.76rem;color:var(--t2);margin-top:3px}
.mini{background:var(--p);border:1px solid var(--l2);color:var(--t);border-radius:0;padding:5px 12px;font-size:.72rem;cursor:pointer;font-family:var(--sans);font-weight:600}
.mini:hover{border-color:var(--acc)}
.mini:disabled{opacity:.45}
.tabela{width:100%;border-collapse:collapse;font-size:.86rem}
.tabela th{text-align:left;color:var(--t3);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;padding:0 14px 9px;border-bottom:1px solid var(--l2);font-weight:600}
.tabela td{padding:12px 14px;border-bottom:1px solid var(--fina);vertical-align:middle}
.tabela td, .tabela td *{font-family:var(--sans)}
.tabela td b{font-weight:600}
.tabela tr:hover td{background:#F7F5F0}
.tabela tr:last-child td{border-bottom:0}
.badge{font-size:.62rem;font-weight:700;border-radius:4px;padding:2px 7px;color:#FFFFFF;font-family:var(--sans);white-space:nowrap}
.pill{font-size:.68rem;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill.ok{color:var(--n);background:var(--nd)}
.pill.ok2{color:var(--n);background:var(--nd)}
.pill.ruim{color:var(--no);background:var(--nof)}
.pill.est{color:var(--gold);background:#FBF4E6}
#lucroVendas td:not(:first-child){white-space:nowrap}
#lucroVendas td:first-child{min-width:220px}
.impop{display:block;width:100%;text-align:left;background:none;border:0;color:var(--t);font-family:var(--sans);font-size:.8rem;padding:8px 10px;cursor:pointer}
.impop:hover{background:var(--p2)}
#porcanal .tabela{font-size:.82rem}
#porcanal .tabela td,#porcanal .tabela th{padding:12px 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--p);border:1px solid var(--l);color:var(--t2);border-radius:0;padding:6px 13px;font-size:.78rem;font-weight:500;cursor:pointer;font-family:var(--sans)}
.chip.atv{background:var(--p);border-color:var(--acc);color:var(--t);font-weight:600}
.busca{background:var(--p);border:1px solid var(--l2);border-radius:0;padding:8px 13px;color:var(--t);font-size:.83rem;min-width:240px}
.tit{font-size:.9rem;font-weight:600}
.lb{font-size:.72rem;color:var(--t2);display:flex;flex-direction:column;gap:4px;font-weight:500}
.w100{width:100%;min-width:0}
.edt{width:92px;background:var(--p);border:1px solid var(--l2);border-radius:0;color:var(--t);padding:5px 8px;font-family:var(--sans);font-size:.8rem}
.edt:focus{outline:2px solid #1F6B4A55}
.itg{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;border-radius:0;padding:11px 12px;color:var(--t2);font-family:var(--sans);font-size:.85rem;font-weight:500;cursor:pointer}
.itg:hover{background:var(--p2)}
.itg.atv{background:var(--p2);color:var(--t);font-weight:600;box-shadow:inset 3px 0 0 var(--n)}
.ponto{width:8px;height:8px;border-radius:50%;flex:none}
.regra{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--fina);font-size:.83rem;color:var(--t2)}
.regra:last-child{border-bottom:0}
@media(max-width:720px){ .itg-grid{grid-template-columns:1fr!important} .itg-form{grid-template-columns:1fr!important} }
.barra{height:8px;background:#EDEAE3;border-radius:0;margin-top:5px;overflow:hidden}
.barra i{display:block;height:100%;border-radius:0}
.sku{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--fina);font-size:.84rem}
.sku:last-child{border-bottom:0}
.rank{color:var(--t3);width:26px;flex:none;font-size:.76rem}
.etq{border:1px solid var(--l2);border-radius:0;max-width:230px;background:#fff}
.acao{background:var(--p);border:1px solid var(--l2);border-radius:0;padding:14px 16px;cursor:pointer;text-align:left;font-family:var(--sans);color:var(--t);transition:border-color .15s}
.acao:hover{border-color:var(--acc)}
.acao b{font-size:.88rem;display:block;font-weight:600}
.acao small{color:var(--t2);font-size:.75rem}
.acao.rodando{opacity:.55;pointer-events:none}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:92%;padding:10px 14px;border-radius:0;font-size:.85rem;line-height:1.5}
.u{align-self:flex-end;background:var(--acc);color:#FBFAF7}
.ai{align-self:flex-start;background:var(--p);border:1px solid var(--l2);color:var(--t2)}
.ai b{color:var(--t);font-weight:600}
.inpt{display:flex;gap:8px;background:var(--p);border:1px solid var(--l2);border-radius:0;padding:10px 13px;align-items:center;margin-top:4px}

@media(max-width:720px){
  .topo-in{gap:8px;padding:0 14px;min-height:50px}
  .nav{padding:0 14px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{padding:11px 9px;white-space:nowrap;font-size:.8rem}
  .logo{font-size:1.2rem}
  .live{display:none}
  .wrap{padding:6px 14px 40px}
  .busca{min-width:0;flex:1;width:100%}
  .grid,.grid4{grid-template-columns:1fr 1fr}
  .kpi .val{font-size:1.3rem}
  .tabela{font-size:.8rem}
  .tabela td,.tabela th{padding:10px 8px}
  h1{font-size:1.5rem}
  .bub{max-width:100%}
  .etq{max-width:100%}
}
/* Um KPI por linha no celular vira rolagem demais pra ver quatro numeros;
   dois cabem e o rotulo ainda le. */
/* Os quatro números do período: divididos por régua, sem caixa em volta.
   Caixa em torno de número não acrescenta informação — só ruído. */
.numeros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--l2);border-bottom:1px solid var(--l2);background:var(--p)}
.numeros>div{padding:15px 22px;border-left:1px solid var(--l)}
.numeros>div:first-child{border-left:0}
.numeros .lbl{font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);font-weight:600}
.numeros .val{font-size:1.8rem;font-weight:600;letter-spacing:-.028em;margin-top:4px;font-variant-numeric:tabular-nums}
.numeros .sub{font-size:.76rem;color:var(--t2);margin-top:3px}
/* A conta vai até o fim e diz quando é parcial, em vez de parar no meio
   mostrando travessão. */
.conta{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--l2);background:var(--p);margin-top:14px}
.conta>div{padding:14px 18px;border-left:1px solid var(--l)}
.conta>div:first-child{border-left:0}
.conta .r{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:600}
.conta .v{font-size:1.02rem;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.conta .falta{font-size:.86rem;font-weight:400;color:var(--t3);margin-top:5px}
.conta .fim{border-left:2px solid var(--acc);background:#F4F7F4}
.conta .fim .r{color:var(--n)}
.conta .fim .v{color:var(--n);font-weight:700}
.conta .obs{font-size:.7rem;color:var(--t2);margin-top:3px;line-height:1.35}
/* duas colunas de trabalho (calculadora+regras, chat+automacoes) */
.colunas{display:grid;grid-template-columns:1fr 1.35fr;gap:26px;align-items:start}
@media(max-width:980px){ .colunas{grid-template-columns:1fr!important} }
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:460px){ .campos{grid-template-columns:1fr} }
.cabRel{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;border-bottom:2px solid var(--acc);padding-bottom:12px;margin:22px 0 0}
/* Dentro do cabecalho o subtitulo nao leva regua propria: no desktop as duas
   coincidem, mas no celular elas empilham e viram duas linhas. */
.cabRel .sub-h1{border-bottom:0;padding-bottom:0}
@media(max-width:900px){ .numeros{grid-template-columns:1fr 1fr} .conta{grid-template-columns:1fr 1fr 1fr} }
@media(max-width:560px){ .conta{grid-template-columns:1fr 1fr} .numeros>div{padding:13px 15px} .numeros .val{font-size:1.35rem} }
@media(max-width:460px){ .grid{grid-template-columns:1fr} .grid4{grid-template-columns:1fr 1fr}
  .kpi .lbl{font-size:.6rem;letter-spacing:.06em} .kpi .val{font-size:1.15rem} .kpi .sub{font-size:.7rem} }
</style></head><body>
<div class="topo" id="topo" style="display:none"><div class="topo-in">
  <div class="logo">Smart<em>Place</em> AI</div>
  <div class="dir"><span class="live"><span class="dot"></span> <span id="autosAtivas">automações ativas</span></span><a id="testeInfo" class="pill" href="/#precos" style="display:none;text-decoration:none;color:var(--gold);background:var(--p2)"></a><span id="lojaNome" style="color:var(--t);font-size:.82rem"></span><button class="sair" id="sair">sair</button></div>
</div><div class="nav-wrap"><div class="nav" id="nav"></div>
</div></div>
<div class="wrap" id="app"></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzZ2VnZ2thd2VpeGFxeHh0YnFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MjE2NDIsImV4cCI6MjA5OTA5NzY0Mn0.54iKvZIPENqukwtU2f0GYGSV-rwDMGDVEk3XdWmIhmE";
const sb = createClient("https://ssgeggkaweixaqxxtbqm.supabase.co", ANON);
const OAUTH = "https://ssgeggkaweixaqxxtbqm.supabase.co/functions/v1/smartplace-oauth";
// Qual loja este login está operando agora. Vazio = a primeira do usuário.
// Quem atende várias lojas (agência) troca pela tela Carteira.
let LOJA_ATUAL = (()=>{ try { return localStorage.getItem("sp_loja_atual") || ""; } catch(e) { return ""; } })();
function trocarLoja(id){
  LOJA_ATUAL = id || "";
  try { localStorage.setItem("sp_loja_atual", LOJA_ATUAL); } catch(e) {}
  CACHE = { painel:null, dados:null, ads:null, regras:null };
  VIEW = "dashboard"; location.hash = "#dashboard";
  render();
}
const app = document.getElementById("app");
const NOMES = {mercado_livre:["Mercado Livre","#FFE600","ML","ml.png"],shopee:["Shopee","#EE4D2D","S","shopee.svg"],tiktok:["TikTok Shop","#161616","TT","tiktok-tinta.svg"]};
const ico = (c,s=18)=> NOMES[c]?`<img src="/icons/${NOMES[c][3]}" alt="${NOMES[c][0]}" style="width:${Math.round(s*1.15)}px;height:${s}px;object-fit:contain;vertical-align:middle">`:"";
const MENU = [["dashboard","Dashboard"],["pedidos","Pedidos"],["etiquetas","Etiquetas"],["ia","Gestão IA"],["precos","Precificação"],["ads","Ads"],["produtos","Produtos"],["pesquisa","Pesquisa"],["canais","Integrações"],["fiscal","Fiscal"],["carteira","Carteira"]];

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const brl = v => Number(v??0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
let VIEW = (location.hash||"#dashboard").slice(1);
let CACHE = { painel:null, dados:null, ads:null, regras:null };

// Traduz qualquer formato de falha numa frase que o cliente entenda.
// Antes isso virava "Ops: undefined" quando a resposta não trazia `error`,
// e aí ninguém — nem a IA — sabia o que tinha acontecido.
function msgErro(d, r){
  const e = d && (d.error || d.message || d.msg || d.error_description);
  if (e) return String(e);
  if (r && r.status === 401) return "Sua sessão expirou. Entre de novo, por favor.";
  if (r && r.status === 429) return "Muitas solicitações seguidas. Aguarde alguns segundos e tente de novo.";
  if (r && r.status >= 500) return "O serviço não respondeu agora. Tente de novo em instantes.";
  if (r && !r.ok) return "A solicitação não foi aceita (código " + r.status + ").";
  return "Não consegui concluir e não recebi o motivo. Tente de novo em instantes.";
}

// O erro do servidor às vezes traz o canal com o nome do banco (mercado_livre).
// O cliente não conhece esse nome — troca pelo nome que ele vê na tela.
const humano = t => String(t||"")
  .replace(/mercado_livre/g,"Mercado Livre").replace(/tiktok/g,"TikTok Shop").replace(/shopee/g,"Shopee");
async function acaoApi(acao, params){
  const { data:{ session } } = await sb.auth.getSession();
  // Plataforma pedindo pausa ("Retry after 1234ms") não é assunto do cliente:
  // espera o tempo pedido e repete sozinha antes de mostrar qualquer erro.
  let d = null, r = null;
  for (let tent = 0; tent < 3; tent++){
    r = await fetch("https://ssgeggkaweixaqxxtbqm.supabase.co/functions/v1/smartplace-acoes",{
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+session.access_token, "apikey":ANON },
      body: JSON.stringify({ acao, params: params||{}, loja_id: LOJA_ATUAL || undefined })
    });
    try { d = await r.json(); } catch(_) { d = null; }
    if (!d || typeof d !== "object") return { success:false, error: msgErro(null, r) };
    if (d.success) return d;
    const m = String(d.error||"").match(/Retry after (\d+)ms/i);
    const pausa = m ? Math.min(Number(m[1])+500, 12000) : (r.status===429 ? 4000 : 0);
    if (!pausa || tent === 2) break;
    await new Promise(res=>setTimeout(res, pausa));
  }
  if (!d.success && !d.error) d.error = msgErro(d, r);
  if (/rate limit|retry after/i.test(String(d.error||"")))
    d.error = "O canal está limitando as chamadas agora (cota da plataforma, não é problema da sua loja). Já repeti a tentativa — aguarda um instante e pede de novo.";
  return d;
}

async function render(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ document.getElementById("topo").style.display="none"; return telaLogin(); }
  if(new URLSearchParams(location.search).has("nova_senha")) return telaNovaSenha();
  const { data, error } = await sb.rpc("sp_painel");
  if(error){ app.innerHTML = "<p class='vazio'>Erro: "+esc(error.message)+"</p>"; return; }
  if(data?.sem_loja){ document.getElementById("topo").style.display="none"; return telaOnboarding(); }
  CACHE.painel = data;
  // volta do Mercado Pago: confere a assinatura na hora, sem esperar a rotina
  if(new URLSearchParams(location.search).has("assinatura")){
    history.replaceState(null, "", "/app/");
    const c = await acaoApi("assinatura_conferir");
    if(c.success && c.resultado?.status && c.resultado.status !== data.loja.status) return render();
    if(c.success && c.resultado?.assinatura_status === "pending") return telaPlanos({ ...data, loja:{ ...data.loja, assinatura_status:"pending" } }, true);
  }
  const dias = diasDeTeste(data.loja);
  if((dias !== null && dias <= 0) || data.loja?.status === "suspensa") return telaPlanos(data);
  if(concluirTiktokPendente(data.loja?.id)) return;
  shell();
}

// Teste grátis de 14 dias. null = loja assinante (ou interna), sem contagem.
function diasDeTeste(loja){
  if(!loja || loja.status !== "trial" || !loja.teste_ate) return null;
  return Math.ceil((new Date(loja.teste_ate) - Date.now()) / 86400000);
}

// Escolha do plano e assinatura pelo Mercado Pago. Abre sozinha quando o teste
// acaba ou a assinatura para; durante o teste, pelo selo "teste grátis" do topo.
async function telaPlanos(d, voltar = false){
  document.getElementById("topo").style.display="none";
  const l = d.loja, dias = diasDeTeste(l), acabou = dias !== null && dias <= 0;
  const titulo = l.status === "suspensa" ? "Sua assinatura está parada" : acabou ? "Seu teste grátis de 14 dias acabou" : "Escolha seu plano";
  const sub = l.status === "suspensa" ? "O Mercado Pago cancelou ou pausou a cobrança. Seus dados e canais continuam guardados: assine de novo e a IA volta a trabalhar."
    : acabou ? "Seus dados e seus canais continuam guardados. Escolha um plano e a IA volta a trabalhar na sua loja."
    : l.teste_ate ? `Você continua no teste até ${new Date(l.teste_ate).toLocaleDateString("pt-BR")}. A primeira cobrança só acontece nesse dia.` : "";
  const { data:{ session } } = await sb.auth.getSession();
  app.innerHTML = `
  <div class="centro" style="max-width:440px">
    <div class="logo" style="text-align:center;font-size:1.5rem">Smart<em>Place</em> AI</div>
    <p style="text-align:center;font-weight:600;margin:0">${titulo}</p>
    <p style="color:var(--t2);text-align:center;font-size:.9rem;margin:0">${sub}</p>
    ${l.assinatura_status === "pending" ? `<p style="font-size:.82rem;color:var(--gold);text-align:center;margin:0">Tem uma assinatura esperando a confirmação do Mercado Pago. Se você já autorizou o cartão, clique em "Já assinei".</p>` : ""}
    <div id="planos"><p class="vazio">carregando planos…</p></div>
    <label style="font-size:.8rem;color:var(--t2);display:flex;flex-direction:column;gap:4px">E-mail da sua conta do Mercado Pago
      <input id="mpEmail" type="email" value="${esc(session?.user?.email || "")}"></label>
    <button class="btn" id="assinarMp">Assinar com Mercado Pago</button>
    <div class="erro" id="erro"></div>
    <button class="link" id="jaAssinei">Já assinei: conferir</button>
    <a class="link" href="/#precos">Ver o que cada plano inclui</a>
    <button class="link" id="sairFim">${voltar ? "Voltar ao painel" : "Sair"}</button>
  </div>`;
  const erro = m => document.getElementById("erro").textContent = m;
  document.getElementById("sairFim").onclick = async()=>{ if(voltar) return render(); await sb.auth.signOut(); render(); };

  const r = await acaoApi("assinatura_planos");
  if(!r.success) return erro(r.error);
  const planos = r.resultado.planos, vagas = r.resultado.vagas_fundador;
  let escolhido = planos.some(p=>p.id==="essencial") ? "essencial" : planos[0]?.id;
  const desenha = ()=>{
    document.getElementById("planos").innerHTML = planos.map(p=>`
      <label style="display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid ${p.id===escolhido?"var(--acc)":"var(--l)"};padding:12px 14px;font-size:.9rem;cursor:pointer;margin-bottom:8px">
        <span><input type="radio" name="plano" value="${p.id}" ${p.id===escolhido?"checked":""} style="padding:0;margin:0 8px 0 0;vertical-align:middle">${esc(p.nome)}${p.id==="fundador"?`<br><span style="font-size:.74rem;color:var(--t3)">preço travado pra sempre · ${vagas} vaga${vagas===1?"":"s"}</span>`:""}</span>
        <b style="white-space:nowrap">${brl(p.valor)}/mês</b></label>`).join("");
    document.querySelectorAll("#planos input[name=plano]").forEach(i=>i.onchange=()=>{ escolhido = i.value; desenha(); });
  };
  desenha();

  document.getElementById("assinarMp").onclick = async(e)=>{
    e.target.disabled = true; erro("");
    const a = await acaoApi("assinar", { plano: escolhido, email: document.getElementById("mpEmail").value });
    if(!a.success){ e.target.disabled = false; return erro(a.error); }
    location.href = a.resultado.link;
  };
  document.getElementById("jaAssinei").onclick = async(e)=>{
    e.target.disabled = true;
    const c = await acaoApi("assinatura_conferir");
    e.target.disabled = false;
    if(c.success && c.resultado?.status === "ativa") return render();
    erro(c.success ? "A confirmação do Mercado Pago ainda não chegou. Se você acabou de autorizar, espere um minuto e clique de novo." : c.error);
  };
}

// Instalação feita pela loja de apps do TikTok volta sem dizer a loja do
// SmartPlace: a página de retorno guarda o código e, com o login feito, ele é
// concluído na loja de quem entrou. O código do TikTok vale poucos minutos.
function concluirTiktokPendente(lojaId){
  let p = null;
  try { p = JSON.parse(localStorage.getItem("sp_tt_code_pendente") || "null"); } catch(e) {}
  if(!p || !p.code || !lojaId) return false;
  try { localStorage.removeItem("sp_tt_code_pendente"); } catch(e) {}
  if(Date.now() - Number(p.em || 0) > 10*60*1000) return false;
  location.replace(`${OAUTH}?fluxo=callback&plataforma=tiktok&code=${encodeURIComponent(p.code)}&state=${encodeURIComponent(lojaId)}`);
  return true;
}

// ── casca do ERP: topo fixo + menu + conteúdo por tela ──
function shell(){
  const d = CACHE.painel;
  document.getElementById("topo").style.display="";
  document.getElementById("lojaNome").textContent = d.loja.nome;
  const ti = document.getElementById("testeInfo"), dias = diasDeTeste(d.loja);
  ti.style.display = dias === null ? "none" : "";
  if(dias !== null){
    ti.textContent = (dias <= 1 ? "teste grátis: último dia" : `teste grátis: faltam ${dias} dias`) + " · assinar";
    ti.onclick = e=>{ e.preventDefault(); telaPlanos(d, true); };
  }
  const aa = document.getElementById("autosAtivas");
  if(aa){ const n = (d.automacoes||[]).filter(a=>a.ligada).length; aa.textContent = n ? `${n} automaç${n>1?"ões":"ão"} ativa${n>1?"s":""}` : "nenhuma automação ligada"; }
  document.getElementById("nav").innerHTML = MENU.map(([v,n])=>`<button data-v="${v}" class="${v===VIEW?"atv":""}">${n}${v==="ia"?`<span class="qtd" id="qtdAvisos" style="display:none"></span>`:""}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{ VIEW=b.dataset.v; location.hash=VIEW; shell(); });
  document.getElementById("sair").onclick = async()=>{ await sb.auth.signOut(); HIST=[]; CACHE={painel:null,dados:null,ads:null,regras:null}; render(); };
  marcaAvisos();
  const av = avisosAbertos(d), urg = av.filter(avisoUrgente).length;
  const views = { dashboard:viewDashboard, pedidos:viewPedidos, etiquetas:viewEtiquetas, precos:viewPrecos, ia:viewIA, ads:viewAds, canais:viewCanais, carteira:viewCarteira, produtos:viewProdutos, pesquisa:viewPesquisa, fiscal:viewFiscal };
  // só o Dashboard lembra, numa linha; a lista mora na Gestão IA
  app.innerHTML = (VIEW==="dashboard" && av.length
    ? `<div class="alerta" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap${urg?";border-left-color:var(--no)":""}"><span style="flex:1"><b style="color:var(--t)">${av.length} aviso${av.length>1?"s":""} esperando você</b>${urg?` · ${urg} urgente${urg>1?"s":""}`:""}</span><button class="mini" id="verAvisos" style="flex:none">Ver na Gestão IA</button></div>`
    : "") + `<div id="conteudo"></div>`;
  const va = document.getElementById("verAvisos");
  if(va) va.onclick = ()=>{ VIEW="ia"; location.hash=VIEW; shell(); };
  (views[VIEW]||viewDashboard)(document.getElementById("conteudo"));
}

// Avisos abertos sem repetição de texto; o número aparece no menu da Gestão IA.
function avisosAbertos(d){
  const jaVi = new Set();
  return (d.alertas||[]).filter(a=>{ const k=(a.mensagem||"").trim(); if(!k||jaVi.has(k)) return false; jaVi.add(k); return true; });
}
function avisoUrgente(a){ return a.severidade==="urgente" || a.severidade==="critico"; }
function marcaAvisos(){
  const el = document.getElementById("qtdAvisos"); if(!el || !CACHE.painel) return;
  const av = avisosAbertos(CACHE.painel);
  el.style.display = av.length ? "" : "none";
  el.textContent = av.length;
  el.className = "qtd" + (av.some(avisoUrgente) ? " urg" : "");
}

async function dados(force){
  if(!CACHE.dados || force){ const r = await acaoApi("dados_pedidos"); CACHE.dados = r.success ? r.resultado : { erro: r.error }; }

}

// ── Dashboard ──
function grafBarras(dias){
  const max = Math.max(...dias.map(d=>d.total), 1);
  const W=940,H=170,bw=W/dias.length;
  return `<svg viewBox="0 0 ${W} ${H+26}" style="width:100%;display:block">
    ${dias.map((d,i)=>{ const h=Math.max(Math.round(d.total/max*H), d.total?4:2);
      return `<rect x="${(i*bw+2).toFixed(1)}" y="${H-h}" width="${(bw-4).toFixed(1)}" height="${h}" rx="3" fill="${d.total?"#1F6B4A":"#DCD7CC"}"><title>${d.dia.slice(8,10)}/${d.dia.slice(5,7)} — ${brl(d.total)}</title></rect>`;}).join("")}
    ${dias.map((d,i)=> i%5===0?`<text x="${(i*bw+2).toFixed(1)}" y="${H+18}" fill="#6A87A3" font-size="11" font-family="JetBrains Mono,monospace">${d.dia.slice(8,10)}/${d.dia.slice(5,7)}</text>`:"").join("")}
  </svg>`;
}
const hoje = off => new Date(Date.now()+off*86400000).toISOString().slice(0,10);
let FDASH = { de: hoje(-29), ate: hoje(0), canal: "todos" };
function grafCanais(porCanal){
  const ents = Object.keys(NOMES).map(k=>[k, porCanal[k]?porCanal[k].total:0]);
  const max = Math.max(...ents.map(e=>e[1]), 1);
  const soma = ents.reduce((a,e)=>a+e[1],0) || 1;
  const W=460,H=132,bw=W/ents.length,LARG=Math.min(bw*0.42,52);
  return `<svg viewBox="0 0 ${W} ${H+34}" style="width:100%;display:block">
    <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="#C9C3B6" stroke-width="1"/>
    ${ents.map(([k,v],i)=>{ const h=v?Math.max(Math.round(v/max*(H-22)),3):2; const x=i*bw+bw/2; const [nome]=NOMES[k];
      return `<rect x="${x-LARG/2}" y="${H-h}" width="${LARG}" height="${h}" fill="${v?"#1F6B4A":"#DCD7CC"}"><title>${nome}: ${brl(v)}</title></rect>
      ${v?`<text x="${x}" y="${H-h-6}" fill="#1A1815" font-size="11" font-weight="600" text-anchor="middle">${Math.round(v/soma*100)}%</text>`:""}
      <text x="${x}" y="${H+16}" fill="#5C574E" font-size="11" text-anchor="middle">${nome}</text>
      <text x="${x}" y="${H+29}" fill="#8A8378" font-size="10" text-anchor="middle">${v?brl(v):"não conectada"}</text>`;}).join("")}
  </svg>`;
}
// Primeiro acesso: loja nova entra no Dashboard zerado e não sabe por onde
// começar — é onde o teste grátis se perde. Três passos, cada um com o botão
// que resolve; some quando tudo está feito ou quando o dono oculta.
let IA_AUTO = null; // ação que a Gestão IA dispara ao abrir (vinda dos primeiros passos)
const lsLe = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsGrava = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };
function primeirosPassos(d){
  const id = d.loja?.id || "";
  if(lsLe("sp_onb_ocultar_"+id)) return "";
  const conectou = (d.conexoes||[]).some(x=>x.status==="conectada");
  const checou = !!lsLe("sp_onb_saude_"+id) || (d.acoes||[]).some(a=>/checagem de saúde/i.test(a.descricao||""));
  const ligou = (d.automacoes||[]).some(a=>a.ligada);
  if(conectou && checou && ligou) return "";
  const passo = (n, feito, tit, sub, botao, alvo) => `
    <div style="display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--fina)">
      <span style="flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;${feito?"background:var(--n);color:#FFF":"border:1.5px solid var(--l2);color:var(--t2)"}">${feito?"✓":n}</span>
      <div style="flex:1;min-width:0"><b style="font-size:.88rem;${feito?"color:var(--t3);text-decoration:line-through":""}">${tit}</b><div style="font-size:.76rem;color:var(--t3)">${sub}</div></div>
      ${feito?"":(n>1 && !conectou)?`<span style="flex:none;font-size:.74rem;color:var(--t3)">depois do passo 1</span>`
        :`<button class="mini onb" data-alvo="${alvo}" style="flex:none;background:var(--acc);border-color:var(--acc);color:#FBFAF7">${botao}</button>`}
    </div>`;
  return `<div class="card" id="onbCard" style="margin:20px 0 4px;padding:16px 20px">
    <div style="display:flex;align-items:baseline;gap:10px">
      <b class="tit" style="font-size:1rem">Primeiros passos</b>
      <span style="font-size:.78rem;color:var(--t3)">${[conectou,checou,ligou].filter(Boolean).length} de 3</span>
      <button class="link" id="onbOcultar" style="margin-left:auto;font-size:.76rem">Ocultar</button>
    </div>
    ${passo(1, conectou, "Conecte seu primeiro canal", "Mercado Livre, Shopee ou TikTok Shop — leva 1 minuto e não muda nada na sua loja", "Conectar", "canais")}
    ${passo(2, checou, "Veja como está sua loja", "a IA confere promoção, frete grátis, avaliações e estoque em cada canal", "Checar agora", "saude")}
    ${passo(3, ligou, "Ligue o que a IA faz sozinha", "promoção que nunca vence, avisos de devolução e de estoque — você escolhe", "Escolher", "ia")}
  </div>`;
}
function ligarPrimeirosPassos(c, d){
  const id = d.loja?.id || "";
  const oc = c.querySelector("#onbOcultar");
  if(oc) oc.onclick = ()=>{ lsGrava("sp_onb_ocultar_"+id, "1"); c.querySelector("#onbCard")?.remove(); };
  c.querySelectorAll(".onb").forEach(b=>b.onclick = ()=>{
    const alvo = b.dataset.alvo;
    if(alvo==="saude"){ lsGrava("sp_onb_saude_"+id, "1"); IA_AUTO = "saude_loja"; VIEW = "ia"; }
    else VIEW = alvo;
    location.hash = VIEW; shell();
  });
}

// Lucro pedido a pedido: o que o marketplace cobrou de verdade (conciliado) ou
// pela tabela do canal (estimado). Carrega à parte porque a 1ª vez confere os
// valores com os marketplaces e leva alguns segundos.
let LUCRO_LINHAS = 10;
async function carregarLucroVendas(){
  const el = document.getElementById("lucroVendas"); if(!el) return;
  LUCRO_LINHAS = 10;
  el.innerHTML = `<p class="vazio">conferindo os valores com os marketplaces…</p>`;
  const res = await acaoApi("lucro_por_venda", FDASH);
  if(!document.getElementById("lucroVendas")) return;
  if(!res.success) return el.innerHTML = `<p class="vazio">${esc(humano(res.error))}</p>`;
  const R = res.resultado, t = R.totais;
  if(!R.linhas.length) return el.innerHTML = `<p class="vazio">Nenhuma venda no período.</p>`;
  const lucroCompleto = t.sem_custo === 0;
  const pct = v => v==null ? "—" : v.toFixed(1).replace(".",",")+"%";
  const menos = v => v ? "&minus; "+brl(v) : "—";
  const desenha = ()=>{
    el.innerHTML = `
      <div style="display:flex;gap:6px 18px;flex-wrap:wrap;font-size:.8rem;color:var(--t2);margin-bottom:12px">
        <span><b style="color:var(--t)">${t.conciliados} de ${t.pedidos}</b> com os valores reais do marketplace</span>
        ${R.ads.total_ml!=null?`<span>Ads do ML no período: <b style="color:var(--t)">${brl(R.ads.total_ml)}</b>${R.ads.sem_venda>0?` · ${brl(R.ads.sem_venda)} em anúncios que não venderam`:""}</span>`:""}
        ${t.sem_custo?`<span style="color:var(--no)">${t.sem_custo} venda${t.sem_custo>1?"s":""} sem custo cadastrado: nelas aparece a sobra antes do custo</span>`:""}
      </div>
      <table class="tabela" style="min-width:880px">
        <tr><th>Venda</th><th style="text-align:right">Valor</th><th style="text-align:right">Taxas</th><th style="text-align:right">Frete</th><th style="text-align:right">Ads</th><th style="text-align:right">Imposto</th><th style="text-align:right">Custo</th><th style="text-align:right">Lucro</th><th style="text-align:right">Margem</th><th></th></tr>
        ${R.linhas.slice(0, LUCRO_LINHAS).map(l=>{
          const fim = l.lucro!=null ? l.lucro : l.sobra;
          return `<tr>
          <td>${ico(l.canal,13)} <span style="font-size:.76rem;color:var(--t3)">${new Date(l.data).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}</span><br><span style="font-size:.8rem">${esc(l.produto)}</span></td>
          <td style="text-align:right">${brl(l.receita)}</td>
          <td style="text-align:right">${menos(l.taxa)}</td>
          <td style="text-align:right">${menos(l.frete)}</td>
          <td style="text-align:right">${menos(l.ads)}</td>
          <td style="text-align:right">${menos(l.imposto)}</td>
          <td style="text-align:right">${l.custo!=null?menos(l.custo)+(l.custo_estimado?'<br><span style="font-size:.68rem;color:var(--t3)">pelo % da loja</span>':""):'<span style="color:var(--t3);font-size:.78rem">falta</span>'}</td>
          <td style="text-align:right;font-weight:600;color:${fim<0?"var(--no)":l.lucro!=null?"var(--n)":"var(--t2)"}">${brl(fim)}${l.lucro==null?'<br><span style="font-size:.68rem;font-weight:400;color:var(--t3)">antes do custo</span>':""}</td>
          <td style="text-align:right">${pct(l.margem_pct)}</td>
          <td><span class="pill ${l.situacao==="conciliado"?"ok":"est"}" title="${l.situacao==="conciliado"?"Taxa e frete como o marketplace cobrou":"Calculado pela tabela do canal: pode mudar"}">${l.situacao}</span></td></tr>`; }).join("")}
        <tr style="font-weight:600"><td>Total · ${t.pedidos} venda${t.pedidos>1?"s":""}</td><td style="text-align:right">${brl(t.receita)}</td><td style="text-align:right">${menos(t.taxa)}</td><td style="text-align:right">${menos(t.frete)}</td><td style="text-align:right">${menos(t.ads)}</td><td style="text-align:right">${menos(t.imposto)}</td><td style="text-align:right">${lucroCompleto?menos(t.custo):"—"}</td><td style="text-align:right">${brl(lucroCompleto?t.lucro:t.sobra)}${lucroCompleto?"":'<br><span style="font-size:.68rem;font-weight:400;color:var(--t3)">antes do custo</span>'}</td><td></td><td></td></tr>
      </table>
      ${R.linhas.length>LUCRO_LINHAS?`<button class="mini" id="lucroMais" style="margin-top:10px">Ver todas as ${R.linhas.length}</button>`:""}
      <div style="font-size:.74rem;color:var(--t3);margin-top:10px"><b>Conciliado</b>: taxa e frete como o marketplace cobrou. <b>Estimado</b>: pela tabela do canal, ainda pode mudar. ${esc(R.ads.nota)}</div>`;
    const b = document.getElementById("lucroMais");
    if(b) b.onclick = ()=>{ LUCRO_LINHAS = R.linhas.length; desenha(); };
  };
  desenha();
}

// ── Pedidos (fila estilo Vendas Online: etapas, mês, seleção, etiquetas, faturar) ──
let FILTRO = { etapa:"todas", canal:"todos", busca:"", mes:"todos" };
let SEL = new Set();
const ETAPAS = { importado:["Importado","ok"], concluido:["Concluído","ok2"], faturado:["Faturado","ok"], cancelado:["Cancelado","ruim"] };
const etapaDe = p => p.etapa || (String(p.status).toLowerCase().includes("cancel") ? "cancelado" : "importado");
function pedidosFiltrados(r){
  return (r.ultimos||[]).filter(p=>{
    if(FILTRO.etapa!=="todas" && etapaDe(p)!==FILTRO.etapa) return false;
    if(FILTRO.canal!=="todos" && p.canal!==FILTRO.canal) return false;
    if(FILTRO.mes!=="todos" && (p.criado_canal_em||"").slice(0,7)!==FILTRO.mes) return false;
    if(FILTRO.busca){ const q=FILTRO.busca.toLowerCase();
      const alvo=(p.pedido_id+" "+(p.comprador||"")+" "+(p.itens||[]).map(i=>(i.titulo||"")+" "+(i.sku||"")).join(" ")).toLowerCase();
      if(!alvo.includes(q)) return false; }
    return true;
  });
}

async function gerarEtiquetas(){

  ZPL_ATUAL = r.resultado.zpl;
  VIEW="etiquetas"; location.hash="etiquetas"; shell();
}

// ── Gestão IA (ações rápidas + chat + automações + histórico) ──
// Carteira: a lista de lojas que este login atende. Existe para quem cuida de
// mais de uma operação — agência, consultor, ou dono com duas lojas. É a tela

// Formulário de verdade: o cliente vê tudo de uma vez, corrige o que quiser e
// salva. Perguntar campo por campo em caixinha é o tipo de coisa que faz o
// cliente desistir no terceiro produto.
function formulario(titulo, campos, valores, aoSalvar){
  const v = valores || {};
  const campo = c => {
    const val = v[c.id] == null ? (c.padrao || "") : v[c.id];
    const dica = c.dica ? `<small style="display:block;color:var(--t3);font-size:.72rem;margin-top:3px">${esc(c.dica)}</small>` : "";
    const largura = c.largo ? "grid-column:1/-1" : "";
    if(c.tipo === "select"){
      return `<label style="display:flex;flex-direction:column;gap:5px;${largura}">
        <span style="font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)">${esc(c.rot)}${c.req?' <span style="color:var(--acc)">*</span>':''}</span>
        <select name="${c.id}" style="background:var(--p2);border:1px solid var(--l);color:var(--t);border-radius:9px;padding:10px 12px;font-family:var(--sans);font-size:.9rem">
          ${c.opcoes.map(o=>`<option value="${esc(o[0])}"${String(val)===String(o[0])?" selected":""}>${esc(o[1])}</option>`).join("")}
        </select>${dica}</label>`;
    }
    return `<label style="display:flex;flex-direction:column;gap:5px;${largura}">
      <span style="font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)">${esc(c.rot)}${c.req?' <span style="color:var(--acc)">*</span>':''}</span>
      <input name="${c.id}" type="${c.tipo||"text"}" ${c.passo?`step="${c.passo}"`:""} value="${esc(String(val))}" placeholder="${esc(c.exemplo||"")}"
        style="background:var(--p2);border:1px solid var(--l);color:var(--t);border-radius:9px;padding:10px 12px;font-family:${c.tipo==="number"?"var(--mono)":"var(--sans)"};font-size:.9rem">
      ${dica}</label>`;
  };

  const fundo = document.createElement("div");
  fundo.style.cssText = "position:fixed;inset:0;background:#050B14CC;backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:36px 18px;overflow-y:auto";
  fundo.innerHTML = `<form class="card" style="max-width:620px;width:100%;padding:26px 28px">
    <b class="tit" style="font-size:1.05rem">${esc(titulo)}</b>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0 20px">${campos.map(campo).join("")}</div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button type="button" class="chip cancelar">Cancelar</button>
      <button type="submit" class="chip" style="background:var(--acc);color:#FBFAF7;border-color:var(--acc);font-weight:700">Salvar</button>
    </div>
    <p class="erroForm" style="color:#A33A2A;font-size:.85rem;margin:12px 0 0;display:none"></p>
  </form>`;
  document.body.appendChild(fundo);
  const form = fundo.querySelector("form");
  const fechar = ()=>fundo.remove();
  fundo.querySelector(".cancelar").onclick = fechar;
  fundo.onclick = e=>{ if(e.target===fundo) fechar(); };
  form.querySelector("input,select")?.focus();
  form.onsubmit = async e=>{
    e.preventDefault();
    const dados = {};
    campos.forEach(c=>{ dados[c.id] = form.elements[c.id].value.trim(); });
    const falta = campos.filter(c=>c.req && !dados[c.id]).map(c=>c.rot);
    const err = form.querySelector(".erroForm");
    if(falta.length){ err.textContent = "Falta preencher: " + falta.join(", "); err.style.display="block"; return; }
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = "Salvando…";
    const r = await aoSalvar(dados);
    if(r && r.erro){ err.textContent = r.erro; err.style.display="block"; btn.disabled=false; btn.textContent="Salvar"; return; }
    fechar();
  };
}

      <div${d.precisam_atencao?' style="background:#FDF7F5"':""}><div class="lbl">Precisam de você</div><div class="val"${d.precisam_atencao?' style="color:var(--no)"':""}>${d.precisam_atencao}</div><div class="sub">${d.precisam_atencao?"resolver hoje":"tudo em dia"}</div></div>
    </div>
    <div class="card" style="margin-top:16px;padding:16px 20px">
      <div style="overflow-x:auto"><table class="tabela"><thead><tr>

      <td><b style="font-size:.84rem">${esc(String(a.titulo||"").slice(0,70))}</b>
        <div style="font-size:.72rem;color:var(--t3)">${a.sku?"SKU "+esc(a.sku)+" · ":""}${a.ativo?"ativo":"pausado"}</div></td>
      <td style="text-align:right">${a.preco?brl(a.preco):(a.tem_variacao?"<span style='color:var(--t3);font-size:.78rem'>por variação</span>":"—")}</td>
      <td style="text-align:right">${a.estoque??"—"}</td>
      <td>${em.length?em.map(o=>`<span class="pill ok">${esc(nome(o))}</span>`).join(" "):(outros.length?`<span style="font-size:.76rem;color:var(--no)">só aqui</span>`:"")}</td>
      <td style="text-align:right"><div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">${copiar}</div></td>
    </tr>`;
  };
  const desenhar = ()=>{
    const lista = todos.filter(a=>(!SO_FALTA || outros.some(o=>!(a.tambem_em||[]).includes(o)))
      && (!BUSCA || String(a.titulo||"").toLowerCase().includes(BUSCA) || String(a.sku||"").toLowerCase().includes(BUSCA)));
    document.getElementById("aCorpo").innerHTML = lista.length ? lista.map(linha).join("")
      : `<tr><td colspan="6"><p class="vazio" style="margin:0">${todos.length?"Nada com esse filtro.":"Nenhum anúncio neste canal."}</p></td></tr>`;
    c.querySelectorAll(".cp").forEach(b=>b.onclick=()=>{
      const a = todos.find(x=>x.id===b.dataset.id);
      copiarAnuncio(ANUNCIOS_CANAL, a, b.dataset.dest, ()=>viewAnuncios(c));
    });
  };
  c.querySelectorAll("[data-canal]").forEach(b=>b.onclick=()=>{ ANUNCIOS_CANAL=b.dataset.canal; viewAnuncios(c); });
  document.getElementById("aBusca").oninput = e=>{ BUSCA=e.target.value.trim().toLowerCase(); desenhar(); };
  const bf = document.getElementById("aFalta");
  if(bf) bf.onclick = ()=>{ SO_FALTA=!SO_FALTA; bf.classList.toggle("atv",SO_FALTA); desenhar(); };
  desenhar();
}

// Cópia de anúncio entre canais: prévia montada no servidor (ficha + conferência
// do próprio canal), o dono ajusta o que quiser e só então publica.
function copiarAnuncio(origem, anuncio, destino, depois){
  const nome = k => NOMES[k] ? NOMES[k][0] : k;
  const LIM = { mercado_livre:60, shopee:120, tiktok:255 };
  const fundo = document.createElement("div");
  fundo.style.cssText = "position:fixed;inset:0;background:#050B14CC;backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow-y:auto";
  fundo.innerHTML = `<div class="card" style="max-width:760px;width:100%;padding:24px 22px"></div>`;
  document.body.appendChild(fundo);
  const caixa = fundo.firstElementChild;
  const fechar = ()=>fundo.remove();
  fundo.onclick = e=>{ if(e.target===fundo && !caixa.dataset.ocupado) fechar(); };
  const topo = `<div style="display:flex;gap:10px;align-items:center">${ico(destino,20)}
      <b class="tit" style="font-size:1.05rem">Copiar para ${esc(nome(destino))}</b></div>
    <div style="font-size:.8rem;color:var(--t3);margin:4px 0 0">De ${esc(nome(origem))}: ${esc(String(anuncio.titulo||"").slice(0,90))}</div>`;

  // A prévia leva de 20 s a 1 min: dizer em que passo está segura o cliente.
  caixa.dataset.ocupado = "1";
  const passos = ["Lendo o anúncio, as variações e as fotos…", "Escolhendo a categoria no "+nome(destino)+"…", "Preenchendo as características com a IA…", "Conferindo a ficha com o "+nome(destino)+"…"];
  let ip = 0;
  caixa.innerHTML = topo + `<p class="vazio" id="cpPasso" style="margin:22px 0 6px">${passos[0]}</p><p style="font-size:.76rem;color:var(--t3);margin:0">Pode levar até 1 minuto.</p>`;
  const tique = setInterval(()=>{ ip = Math.min(ip+1, passos.length-1); const el = document.getElementById("cpPasso"); if(el) el.textContent = passos[ip]; }, 9000);

  let TABELA = null; // imagem da tabela de medidas escolhida pelo dono (data URL)
  acaoApi("copiar_preparar", { origem, item_id: anuncio.id, destino }).then(r=>{
    clearInterval(tique); delete caixa.dataset.ocupado;
    if(!r.success){
      caixa.innerHTML = topo + `<p style="color:var(--no);font-size:.9rem;margin:18px 0">${esc(humano(r.error))}</p>
        <div style="display:flex;justify-content:flex-end"><button class="chip" id="cpFechar">Fechar</button></div>`;
      document.getElementById("cpFechar").onclick = fechar; return;
    }
    desenhaPrevia(r.resultado);
  });

  function desenhaPrevia(p){
    const vs = p.variacoes || [];
    const pedeGtin = (p.problemas||[]).some(x=>/código de barras/i.test(x)) || vs.some(v=>v.gtin);
    const pedeTabela = (p.problemas||[]).some(x=>/tabela de medidas/i.test(x)) || TABELA;
    const pedeCategoria = (p.problemas||[]).some(x=>/categoria sugerida/i.test(x));
    const rotulo = v => Object.values(v.opcoes||{}).join(" · ") || "Único";
    const campoNum = (cls, i, val, passo) => `<input class="${cls}" data-i="${i}" type="number" step="${passo}" value="${esc(String(val??""))}" style="width:96px;background:var(--p2);border:1px solid var(--l);padding:6px 8px;font-family:var(--mono);font-size:.82rem;text-align:right">`;
    caixa.innerHTML = topo + `
      <div style="display:flex;gap:6px;margin:16px 0 0;overflow-x:auto">
        ${(p.fotos||[]).map(u=>`<img src="${esc(u)}" alt="" style="width:64px;height:64px;object-fit:cover;flex:none;border:1px solid var(--l2)">`).join("")}
        ${p.total_fotos>(p.fotos||[]).length?`<div style="width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--l2);font-size:.8rem;color:var(--t2)">+${p.total_fotos-(p.fotos||[]).length}</div>`:""}
      </div>
      <label style="display:flex;flex-direction:column;gap:5px;margin:16px 0 0">
        <span style="font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)">Título no ${esc(nome(destino))} <span id="cpConta" style="font-weight:500"></span></span>
        <input id="cpTitulo" maxlength="${LIM[destino]||255}" value="${esc(p.titulo||"")}" style="background:var(--p2);border:1px solid var(--l);padding:10px 12px;font-size:.9rem;font-family:var(--sans)">
      </label>
      <div style="font-size:.82rem;color:var(--t2);margin:10px 0 0">Categoria: <b>${esc(p.categoria||"—")}</b></div>
      <div style="overflow-x:auto;margin:14px 0 0"><table class="tabela"><thead><tr>
        <th>Variação</th><th>SKU</th><th style="text-align:right">Preço</th><th style="text-align:right">Estoque</th>${pedeGtin?`<th>Código de barras</th>`:""}
      </tr></thead><tbody>${vs.map((v,i)=>`<tr>
        <td>${esc(rotulo(v))}</td><td style="font-size:.78rem;color:var(--t2)">${esc(v.sku||"—")}</td>
        <td style="text-align:right">${campoNum("cpPreco",i,v.preco,"0.01")}</td>
        <td style="text-align:right">${campoNum("cpEstoque",i,v.estoque,"1")}</td>
        ${pedeGtin?`<td><input class="cpGtin" data-i="${i}" value="${esc(v.gtin||"")}" placeholder="EAN de 13 dígitos" style="width:150px;background:var(--p2);border:1px solid var(--l);padding:6px 8px;font-family:var(--mono);font-size:.82rem"></td>`:""}
      </tr>`).join("")}</tbody></table></div>
      ${(p.caracteristicas||[]).length?`<div style="margin:14px 0 0">
        <div style="font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:6px">Características preenchidas pela IA</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px;font-size:.8rem">
          ${p.caracteristicas.map(x=>`<div><span style="color:var(--t3)">${esc(x.nome)}:</span> ${esc(x.valor)}</div>`).join("")}
        </div></div>`:""}
      ${p.medidas_estimadas?`<p style="font-size:.78rem;color:var(--t3);margin:10px 0 0">A origem não tem medida de embalagem: usei 20×15×5 cm. Ajuste depois no canal se for diferente.</p>`:""}
      <div id="cpProblemas"></div>
      ${pedeTabela?`<label style="display:flex;flex-direction:column;gap:5px;margin:12px 0 0">
        <span style="font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)">Imagem da tabela de medidas</span>
        <input id="cpTabela" type="file" accept="image/*" style="font-size:.82rem">
        ${TABELA?`<span style="font-size:.76rem;color:var(--n)">Imagem escolhida.</span>`:""}
      </label>`:""}
      ${pedeCategoria?`<label style="display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:.84rem"><input id="cpAceita" type="checkbox"> A categoria está certa: publicar mesmo assim</label>`:""}
      ${destino==="shopee"?`<label style="display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:.84rem"><input id="cpOculto" type="checkbox"> Publicar oculto (você revisa no Seller Center antes de liberar)</label>`:""}
      <div style="display:flex;gap:10px;justify-content:flex-end;margin:20px 0 0;flex-wrap:wrap">
        <button class="chip" id="cpCancelar">Cancelar</button>
        <button class="chip" id="cpConferir" style="display:none">Conferir de novo</button>
        <button class="chip" id="cpPublicar" style="background:var(--acc);color:#FBFAF7;border-color:var(--acc);font-weight:700">Publicar no ${esc(nome(destino))}</button>
      </div>
      <p id="cpErro" style="color:var(--no);font-size:.85rem;margin:10px 0 0"></p>`;

    const tit = document.getElementById("cpTitulo"), conta = document.getElementById("cpConta");
    const atualizaConta = ()=>{ conta.textContent = `(${tit.value.length}/${LIM[destino]||255})`; };
    tit.oninput = atualizaConta; atualizaConta();
    const ft = document.getElementById("cpTabela");
    if(ft) ft.onchange = ()=>{ const f = ft.files[0]; if(!f) return; const rd = new FileReader(); rd.onload = ()=>{ TABELA = rd.result; }; rd.readAsDataURL(f); };
    document.getElementById("cpCancelar").onclick = fechar;

    const mostraProblemas = (pronto, problemas)=>{
      document.getElementById("cpProblemas").innerHTML = pronto ? `<p style="font-size:.84rem;color:var(--n);margin:14px 0 0"><b>Pronto para publicar.</b> ${esc(p.confirme||"")}</p>`
        : `<div style="border-left:3px solid var(--no);background:var(--nof);padding:10px 14px;margin:14px 0 0;font-size:.84rem">
            <b>Antes de publicar, falta:</b><ul style="margin:6px 0 0;padding-left:18px">${problemas.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
      const pub = document.getElementById("cpPublicar");
      pub.disabled = !pronto; pub.style.opacity = pronto ? "" : ".45";
      document.getElementById("cpConferir").style.display = pronto ? "none" : "";
    };
    mostraProblemas(p.pronto, p.problemas||[]);

    const ajustes = ()=>{
      const pega = cls => [...caixa.querySelectorAll("."+cls)].map(x=>x.value);
      const a = { titulo: tit.value.trim(), precos: pega("cpPreco"), estoques: pega("cpEstoque") };
      if(caixa.querySelector(".cpGtin")) a.gtins = pega("cpGtin");
      if(TABELA) a.tabela_medidas = TABELA;
      if(document.getElementById("cpAceita")?.checked) a.aceitar_categoria = true;
      return a;
    };
    const ocupa = (botao, texto, fn)=>async()=>{
      const erro = document.getElementById("cpErro"); erro.textContent = "";
      const antes = botao.textContent; botao.disabled = true; botao.textContent = texto; caixa.dataset.ocupado = "1";
      try { await fn(); } finally { delete caixa.dataset.ocupado; if(document.body.contains(botao)){ botao.disabled = false; botao.textContent = antes; } }
    };
    const bConf = document.getElementById("cpConferir");
    bConf.onclick = ocupa(bConf, "Conferindo…", async()=>{
      const rr = await acaoApi("copiar_conferir", { copia_id: p.copia_id, ajustes: ajustes() });
      if(!rr.success) return document.getElementById("cpErro").textContent = humano(rr.error);
      p.problemas = rr.resultado.problemas; p.pronto = rr.resultado.pronto;
      mostraProblemas(rr.resultado.pronto, rr.resultado.problemas||[]);
    });
    const bPub = document.getElementById("cpPublicar");
    bPub.onclick = ocupa(bPub, "Publicando…", async()=>{
      const rr = await acaoApi("copiar_publicar", { copia_id: p.copia_id, ajustes: ajustes(), oculto: !!document.getElementById("cpOculto")?.checked });
      if(!rr.success) return document.getElementById("cpErro").textContent = humano(rr.error);
      const x = rr.resultado;
      const links = (x.anuncios||[]).filter(a=>a.link).map(a=>`<li><a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(Object.values(a.opcoes||{}).join(" · ") || a.id)}</a></li>`).join("")
        || (x.link?`<li><a href="${esc(x.link)}" target="_blank" rel="noopener">Ver o anúncio</a></li>`:"");
      caixa.innerHTML = topo + `<p style="font-size:.95rem;margin:20px 0 6px"><b>Publicado no ${esc(nome(destino))}.</b>${x.oculto?" Está oculto: libere pelo Seller Center quando quiser.":""}</p>
        ${links?`<ul style="font-size:.85rem;margin:6px 0;padding-left:18px">${links}</ul>`:`<p style="font-size:.85rem;color:var(--t2)">Código: ${esc((x.ids||[]).join(", "))}</p>`}
        ${x.aviso?`<p style="font-size:.8rem;color:var(--t3);margin:8px 0 0">${esc(x.aviso)}</p>`:""}
        <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="chip" id="cpFim">Fechar</button></div>`;
      document.getElementById("cpFim").onclick = ()=>{ fechar(); if(depois) depois(); };
    });
  }
}

// Produtos: um cadastro por SKU. É daqui que sai o custo (para a margem) e o
// NCM (para a nota). Sem ele o cliente precisaria de um ERP só para isso.
async function viewCadastroSku(c){
  c.innerHTML = `<h1>Produtos</h1><div class="sub-h1">Um cadastro por SKU — o custo alimenta a margem, o NCM alimenta a nota</div><p class="vazio">Carregando…</p>`;
  const r = await acaoApi("produtos_cadastro", {});
  if(!r.success){ c.innerHTML = `<h1>Produtos</h1><p class="vazio">${esc(r.error)}</p>`; return; }
  const d = r.resultado, ps = d.produtos||[];

  // Linha com problema ganha fundo — o olho encontra o que falta sem ler tudo.
  const linha = p => {
    const pende = p.custo==null || !p.ncm || !(p.canais||[]).length;
    return `<tr${pende?' style="background:#FDF9F8"':""}>
    <td><b>${esc(p.sku)}</b></td>
    <td>${esc(String(p.nome||"").slice(0,52))}</td>
    <td style="text-align:right">${p.custo==null?`<span style="color:var(--no);font-size:.8rem;font-weight:600">falta cadastrar</span>`:brl(p.custo)}</td>
    <td style="text-align:right">${p.ncm||`<span style="color:var(--no);font-size:.8rem;font-weight:600">falta o NCM</span>`}</td>
    <td style="text-align:right">${p.peso==null?"—":String(p.peso).replace(".",",")+" kg"}</td>
    <td>${(p.canais||[]).length?(p.canais||[]).map(x=>NOMES[x]?NOMES[x][0]:x).join(" · "):`<span style="color:var(--no);font-size:.78rem">nenhum ligado</span>`}</td>
    <td style="text-align:right"><button class="mini ed" data-sku="${esc(p.sku)}">Editar</button></td>
  </tr>`;};

  let FILTRO = "todos", BUSCA = "";
  const filtrar = () => ps.filter(p =>
    (FILTRO==="todos" || (FILTRO==="semcusto" && p.custo==null) || (FILTRO==="semanuncio" && !(p.canais||[]).length))
    && (!BUSCA || String(p.sku).toLowerCase().includes(BUSCA) || String(p.nome||"").toLowerCase().includes(BUSCA)));

  c.innerHTML = `
    <div class="cabRel">
      <div style="flex:1 1 300px">
        <h1 style="margin:0">Seus produtos</h1>
        <div class="sub-h1">Um cadastro por SKU — não um por anúncio. É daqui que sai o custo, o peso e o dado fiscal.</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="mini" id="impCat">Importar do Tiny ou Bling</button>
        <button class="mini" id="casarSku">Ligar anúncios pelo SKU</button>
        <button class="mini" id="novoProd" style="background:var(--acc);color:#FBFAF7;border-color:var(--acc)">Novo produto</button>
      </div>
    </div>
    <div class="numeros" style="margin-top:16px;grid-template-columns:repeat(3,minmax(0,1fr))">
      <div><div class="lbl">Cadastrados</div><div class="val">${d.total}</div><div class="sub">produtos no catálogo</div></div>
      <div${d.sem_custo?' style="background:#FDF7F5"':""}><div class="lbl">Sem custo</div><div class="val"${d.sem_custo?' style="color:var(--no)"':""}>${d.sem_custo}</div><div class="sub">a margem real não calcula sem ele</div></div>
      <div${d.sem_anuncio?' style="background:#FDF7F5"':""}><div class="lbl">Sem anúncio ligado</div><div class="val"${d.sem_anuncio?' style="color:var(--no)"':""}>${d.sem_anuncio}</div><div class="sub">o custo não chega na margem sem o vínculo</div></div>
    </div>
    <div class="card" style="margin-top:16px;padding:16px 20px">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
        <input class="busca" id="pBusca" placeholder="Buscar por SKU ou nome" style="flex:1;min-width:180px">
        <button class="chip atv" data-f="todos">Todos</button>
        <button class="chip" data-f="semcusto">Sem custo</button>
        <button class="chip" data-f="semanuncio">Sem anúncio</button>
      </div>
      <div style="overflow-x:auto"><table class="tabela"><thead><tr>
        <th>SKU</th><th>Produto</th><th style="text-align:right">Custo</th><th style="text-align:right">NCM</th>
        <th style="text-align:right">Peso</th><th>Anúncios ligados</th><th></th>
      </tr></thead><tbody id="pCorpo"></tbody></table></div>
      <div style="border-top:1px solid var(--l2);margin-top:12px;padding-top:11px;display:flex;gap:14px;align-items:center;font-size:.8rem;color:var(--t2)">
        <span id="pConta"></span>
        <span style="margin-left:auto">O SKU é o que amarra o produto ao anúncio. Sem ele, o custo não chega na margem.</span>
      </div>
    </div>`;

  const desenhar = () => {
    const lista = filtrar();
    document.getElementById("pCorpo").innerHTML = lista.length ? lista.map(linha).join("")
      : `<tr><td colspan="7"><p class="vazio" style="margin:0">${ps.length?"Nada com esse filtro.":"Nenhum produto ainda. Comece por \"Novo produto\" ou importe do Tiny/Bling."}</p></td></tr>`;
    document.getElementById("pConta").textContent = `Mostrando ${lista.length} de ${ps.length}`;
    c.querySelectorAll(".ed").forEach(b=>b.onclick = ()=>{
      const p = ps.find(x=>String(x.sku)===b.dataset.sku); if(p) abrirProduto(p);
    });
  };
  c.querySelectorAll(".chip[data-f]").forEach(b=>b.onclick=()=>{
    FILTRO=b.dataset.f;
    c.querySelectorAll(".chip[data-f]").forEach(x=>x.classList.toggle("atv",x===b));
    desenhar();
  });
  document.getElementById("pBusca").oninput = e=>{ BUSCA=e.target.value.trim().toLowerCase(); desenhar(); };

  const CAMPOS_PROD = [
    { id:"sku",  rot:"SKU",   req:true, exemplo:"2851-PRETO-M", dica:"É ele que amarra o produto aos anúncios dos canais" },
    { id:"nome", rot:"Nome do produto", req:true, exemplo:"Cinta Modeladora Pós-Cirúrgica" },
    { id:"custo", rot:"Custo", tipo:"number", passo:"0.01", exemplo:"28.50", dica:"Quanto você paga por unidade — sem isso não existe margem" },
    { id:"peso", rot:"Peso (kg)", tipo:"number", passo:"0.001", exemplo:"0.300" },
    { id:"ncm",  rot:"NCM", exemplo:"62122000", dica:"8 dígitos. É do produto — cada um tem o seu" },
    { id:"unidade", rot:"Unidade", padrao:"UN", exemplo:"UN" },
    { id:"ean",  rot:"Código de barras", exemplo:"7898675430125", dica:"Deixe vazio se o produto não tiver" },
    { id:"origem", rot:"Origem", tipo:"select", padrao:"0",
      opcoes:[["0","0 — Nacional"],["1","1 — Importado direto"],["2","2 — Importado no mercado interno"],["3","3 — Nacional com mais de 40% importado"]] },
    { id:"csosn", rot:"CSOSN", padrao:"102", exemplo:"102", dica:"Situação do ICMS no Simples Nacional" },
  ];
  const abrirProduto = p => formulario(p?`Editar ${p.sku}`:"Novo produto", CAMPOS_PROD, p, async dados=>{
    const rr = await acaoApi("produto_salvar", dados);
    if(!rr.success) return { erro: rr.error };
    viewCadastroSku(c);
  });

  document.getElementById("novoProd").onclick = ()=>abrirProduto(null);
  const bImp = document.getElementById("impCat");
  if(bImp) bImp.onclick = ()=>formulario("Importar do Tiny ou Bling", [
      { id:"origem", rot:"De onde vem", tipo:"select", padrao:"bling", opcoes:[["bling","Bling"],["tiny","Tiny"]] },
      { id:"token", rot:"Token de API", req:true, dica:"Usado uma vez pra buscar os produtos — não fica guardado" },
    ], null, async dados=>{
      const rr = await acaoApi("importar_catalogo", { ...dados, confirmar:false });
      if(!rr.success) return { erro: humano(rr.error) };
      const pv = rr.resultado||{};
      if(!confirm(`${pv.importaveis??0} produto(s) prontos pra importar (${pv.sem_custo??0} sem custo, ${pv.sem_sku??0} sem SKU serão ignorados). Importar?`)) return;
      const rc = await acaoApi("importar_catalogo", { ...dados, confirmar:true });
      if(!rc.success) return { erro: humano(rc.error) };
      viewCadastroSku(c);
    });
  desenhar();
  document.getElementById("casarSku").onclick = async()=>{
    const pv = await acaoApi("vincular_por_sku", { confirmar:false });
    if(!pv.success) return alert("Ops: "+pv.error);
    const x = pv.resultado;
    if(!x.casados) return alert(`Nenhum anúncio casou com o cadastro.\n\n${x.sem_produto||0} anúncio(s) têm SKU que não está cadastrado aqui.\n\n${x.regra||""}`);
    if(!confirm(`${x.casados} anúncio(s) casaram pelo SKU.\n${x.sem_produto||0} sem produto cadastrado.\n\n${x.regra||""}\n\nLigar agora?`)) return;
    const rr = await acaoApi("vincular_por_sku", { confirmar:true });
    if(!rr.success) return alert("Ops: "+rr.error);
    alert(`${rr.resultado.vinculados} anúncio(s) ligados `);
    viewCadastroSku(c);
  };
}

// Gestão IA responde as quatro perguntas do dono da loja, nesta ordem: "o que
// posso pedir?", "o que precisa de mim?", "o que dá pra fazer agora?" e "o que
// ela faz sozinha?". Só aparece o que funciona nos canais conectados — botão
// apagado com "em breve" ensina o cliente a não clicar em nada.
function quandoTxt(iso){
  if(!iso) return "";
  const d = new Date(iso), hoje = new Date(), ontem = new Date(Date.now()-86400000);
  const hm = d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  if(d.toDateString()===hoje.toDateString()) return "hoje "+hm;
  if(d.toDateString()===ontem.toDateString()) return "ontem "+hm;
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+hm;
}

      <textarea id="tiTxt" rows="2" placeholder="ex.: tem no tamanho G na cor preta?" style="background:var(--p2);border:1px solid var(--l);padding:9px 10px;font-family:var(--sans);font-size:.88rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--t)"></textarea></label>

    </div></div>`;
  document.body.appendChild(fundo);

  const sel = document.getElementById("tiItem");

  const itens = r.success ? (r.resultado.itens||[]).filter(i=>i.ativo) : [];
  sel.innerHTML = itens.length ? itens.map(i=>`<option value="${esc(i.id)}">${esc(String(i.titulo).slice(0,80))}</option>`).join("") : `<option value="">nenhum anúncio ativo no Mercado Livre</option>`;
  document.getElementById("tiVer").onclick = async e=>{
    const b = e.target, res = document.getElementById("tiRes");
    b.disabled = true; b.textContent = "Pensando…";
    const rr = await acaoApi("pergunta_testar", { item_id: sel.value, texto: document.getElementById("tiTxt").value });
    b.disabled = false; b.textContent = "Ver resposta";
    if(!rr.success){ res.innerHTML = `<p style="color:var(--no);font-size:.86rem;margin:0">${esc(humano(rr.error))}</p>`; return; }
    const x = rr.resultado;
    res.innerHTML = `<div style="border-left:3px solid ${x.publicaria?"var(--n)":"var(--gold)"};background:var(--p2);padding:10px 14px">
      <div style="font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:${x.publicaria?"var(--n)":"var(--gold)"}">${x.publicaria?"No automático, publicaria":"Iria para você responder"}</div>

      ${x.motivo?`<p style="font-size:.78rem;color:var(--t2);margin:6px 0 0">${esc(x.motivo)}</p>`:""}</div>`;
  };
}
